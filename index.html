<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#052659" id="metaTheme">
<title>Control de Gastos Familiares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ================= ESTILOS =================
   Colores como variables (--bg, --fg, --accent…) con versión clara y oscura.
   Debajo: componentes (paneles, tablas, botones, chips, ventanas emergentes)
   y estilos de cada módulo (vehículos, créditos…). */
/* Layout: libro contable de trabajo — barra fija arriba, vistas por pestaña, tablas densas con cifras en mono */
/* Colores: MODO DÍA = paleta azul (#021024 · #052659 · #5483B3 · #7DA0CA · #C1E8FF)
            MODO NOCHE = paleta negra (#0B0B0B · #1A1A1A · #333333 · #6B6B6B · #D9D9D9 · #FFFFFF).
   --top-* son los colores de la barra superior. El botón de tema elige Día, Noche o Automático (según el teléfono o la computadora). */
:root{
  --bg:#EEF5FC; --panel:#FFFFFF; --sunk:#E3EEF9; --line:#C9DDF0; --fg:#021024; --muted:#4A6688;
  --accent:#052659; --accent-ink:#FFFFFF; --accent-soft:#C1E8FF;
  --warn:#9A6A12; --warn-soft:#F8ECD3; --bad:#B03A2E; --bad-soft:#F9E1DD; --good:#2C7A4B;
  --ca:#5483B3; --cb:#7A4E9C; --cc:#B0601E; --azul:#2559A8;
  --top-bg:#052659; --top-fg:#FFFFFF; --top-muted:#C1E8FF; --top-act:rgba(193,232,255,.18); --top-line:#021024; --top-btn:#C1E8FF; --top-btn-ink:#021024;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --panel:#1A1A1A; --sunk:#141414; --line:#333333; --fg:#F2F2F2; --muted:#9A9A9A;
  --accent:#FFFFFF; --accent-ink:#0B0B0B; --accent-soft:#333333;
  --warn:#E0B055; --warn-soft:#3A2F17; --bad:#EF7F6B; --bad-soft:#3D221C; --good:#6BCB8F;
  --ca:#D9D9D9; --cb:#B897D6; --cc:#E3995B; --azul:#9DB8E6;
  --top-bg:#0B0B0B; --top-fg:#FFFFFF; --top-muted:#9A9A9A; --top-act:#333333; --top-line:#333333; --top-btn:#FFFFFF; --top-btn-ink:#0B0B0B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --panel:#1A1A1A; --sunk:#141414; --line:#333333; --fg:#F2F2F2; --muted:#9A9A9A;
  --accent:#FFFFFF; --accent-ink:#0B0B0B; --accent-soft:#333333;
  --warn:#E0B055; --warn-soft:#3A2F17; --bad:#EF7F6B; --bad-soft:#3D221C; --good:#6BCB8F;
  --ca:#D9D9D9; --cb:#B897D6; --cc:#E3995B; --azul:#9DB8E6;
  --top-bg:#0B0B0B; --top-fg:#FFFFFF; --top-muted:#9A9A9A; --top-act:#333333; --top-line:#333333; --top-btn:#FFFFFF; --top-btn-ink:#0B0B0B; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top-bg)}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1800px;margin:0 auto}
@media (min-width:1400px){.wrap{padding-left:32px;padding-right:32px}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--top-bg);color:var(--top-fg);border-bottom:1px solid var(--top-line)}
.top .brand b{color:var(--top-fg)}.top .sync-meta,.top .small{color:var(--top-muted)}.top .small b{color:var(--top-fg)}
.top .btn.ghost{color:var(--top-muted)}.top .btn.ghost:hover{color:var(--top-fg);border-color:transparent}
.top .btn.pri{background:var(--top-btn);color:var(--top-btn-ink);border-color:var(--top-btn)}
.top .count{background:var(--top-btn);color:var(--top-btn-ink)}
.tema-btn{width:32px;height:32px;padding:0!important;display:inline-flex!important;align-items:center;justify-content:center}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:7px;color:var(--top-muted);text-decoration:none;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{background:var(--top-act);color:var(--top-fg)}
nav.tabs a:hover{color:var(--top-fg)}
nav.tabs a .dot{width:8px;height:8px;border-radius:50%}
.count{font-family:var(--f-num);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;line-height:17px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--fg)}
a.btn.pri{color:var(--accent-ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ico{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.btn.ico:hover{background:var(--sunk);color:var(--fg);border-color:transparent}.btn.ico.danger:hover{color:var(--bad)}
td.acc{width:1%;white-space:nowrap}.acc-row{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.sync-meta{font-size:12px;color:var(--muted)}
main{padding-block:20px 60px}
h1{font-size:22px;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;letter-spacing:.01em}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.panel>.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel>.bd{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.app{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.c-a{background:var(--ca)} .c-b{background:var(--cb)} .c-c{background:var(--cc)} .c-d{background:var(--warn)} .c-e{background:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td.desc{min-width:220px}
td .cat{font-size:11px;color:var(--muted)}
select.in,input.in{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font-size:12.5px;max-width:190px}
input.in.num{width:110px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px}
.kpi .v{font-family:var(--f-num);font-size:19px;font-weight:500;margin-top:2px}
.neg{color:var(--bad)} .pos{color:var(--good)}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:12.5px;font-weight:600}
.months button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mes-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mes-pick select.in{width:auto;min-width:0;font-weight:600}
.dist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.dist td,.dist th{padding:7px 10px}
.dist tr.tot td{font-weight:700;border-top:2px solid var(--fg)}
.dist .exp{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dist .exp::before{content:'';width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;opacity:.6}
.dist .exp[aria-expanded="true"]::before{transform:rotate(90deg)}
.dist tr.sub td{font-size:12.5px;color:var(--muted);padding-top:4px;padding-bottom:4px;border-top:0}
.dist tr.sub td:first-child{padding-left:30px}
.dist tr.sub .linkish{color:var(--muted)}
.dist tr.sub.on td{background:var(--accent-soft);color:var(--fg)}
.chart-box{position:relative;padding:4px 14px 10px}
.adj-list{display:flex;flex-direction:column;gap:6px}
.adj{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.adj .th{width:44px;height:44px;border-radius:6px;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font:600 10px var(--f-num);color:var(--muted)}
.adj .th img{width:100%;height:100%;object-fit:cover}
.adj .nm{flex:1;min-width:0}.adj .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.clip{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-left:6px;vertical-align:middle}
.clip svg{width:12px;height:12px}
.ordb{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ordb:hover{color:var(--fg)}
.ordb i{font-style:normal;font-size:9px;opacity:.35}
th[aria-sort] .ordb{color:var(--fg)} th[aria-sort] .ordb i{opacity:1}
th.num .ordb{flex-direction:row-reverse}
.grp td{background:var(--sunk);border-top:1px solid var(--line)}
.grp .gbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.grp .gbtn::before{content:'';border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;opacity:.6}
.grp .gbtn[aria-expanded="true"]::before{transform:rotate(90deg)}
.grp-sub td{background:var(--sunk);font-size:12.5px;color:var(--muted);padding-top:3px;padding-bottom:3px}
.grp-sub td.num{color:var(--fg)}
tr.en-grupo td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.chip.mp{background:var(--accent-soft);color:var(--accent)}
.vsel{display:flex;gap:10px;flex-wrap:wrap}
.vcard{display:flex;gap:12px;align-items:center;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;text-align:left;min-width:0;font:inherit;color:inherit}
.vcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.vcard small{display:block;color:var(--muted);font-size:12px}
.vcard.vnew{border-style:dashed;color:var(--muted)}
.vph{width:64px;height:44px;border-radius:8px;flex:none;overflow:hidden;background:var(--sunk);display:block}
.ficha{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
@media (max-width:760px){.ficha{grid-template-columns:1fr}}
.vfoto{aspect-ratio:16/10;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.datos{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.datos dt{color:var(--muted)} .datos dd{margin:0;font-family:var(--f-num);overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.vchart{position:relative}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);width:100%}
.subtabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input,.form select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel);font-weight:400;font-size:13.5px;min-width:0;color:var(--fg)}
.form input:disabled{opacity:.7}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc>div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.calc b{display:block;font:600 16px var(--f-num)}
.callout{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.vgbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.vgl{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr) 110px auto;gap:6px;align-items:center}
.vgl .in{width:100%;max-width:none;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--panel);font-size:13px;color:var(--fg)}
@media (max-width:700px){.vgl{grid-template-columns:1fr 110px}.vgl .vgTx{grid-column:1/-1;order:-1}}
.prox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.pbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}.pbar>span{display:block;height:100%;border-radius:999px}
.gmini{display:inline-block;width:46px;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;vertical-align:middle}.gmini>span{display:block;height:100%;background:var(--ca)}
.fuelbox{grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk)}
.fuelg{width:200px;max-width:100%;touch-action:none;cursor:grab;border-radius:10px;outline:none;flex:none}
.fuelg:focus-visible{box-shadow:0 0 0 2px var(--accent)} .fuelg.drag{cursor:grabbing} .fuelg svg{display:block;width:100%;height:auto}
.fuelinfo{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.fuelinfo b{font:600 20px var(--f-num)} .fuelinfo #vfNivelSub{min-height:2.8em}
.fuelinfo .btns{display:flex;gap:6px;flex-wrap:wrap}.fuelinfo .btns button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--fg)}
.menu{position:relative;display:inline-block}
.menu>summary{list-style:none;cursor:pointer}.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;min-width:240px;display:flex;flex-direction:column}
.menu-pop button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer;color:var(--fg)}
.menu-pop button:hover{background:var(--sunk)}
.menu-pop .sep{height:1px;background:var(--line);margin:4px 2px}
.menu-pop .eyebrow{padding:6px 10px 2px}
.fx{display:block;font-size:11px;color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.chip.fxc{background:var(--warn-soft);color:var(--warn);font-family:var(--f-num);font-size:10.5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.chart-box svg{display:block;width:100%;overflow:visible}
.chart-box .gl{stroke:var(--line);stroke-width:1}
.chart-box .zl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart-box .ax{fill:var(--muted);font:11px var(--f-num)}
.chart-box .sx{font:600 10.5px var(--f-num)}.chart-box .sx.n{fill:var(--bad)}.chart-box .sx.p{fill:var(--azul)}.chart-box .sx.z{fill:var(--muted)}
.chart-box .ln{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.chart-box .ln.i{stroke:var(--good)} .chart-box .ln.e{stroke:var(--bad)} .chart-box .ln.s{stroke:var(--fg)}
.chart-box .pt{stroke:var(--panel);stroke-width:2}
.chart-box .pt.i{fill:var(--good)} .chart-box .pt.e{fill:var(--bad)} .chart-box .pt.s{fill:var(--fg)}
.chart-box .cross{stroke:var(--muted);stroke-width:1}
.chart-box .hit{fill:transparent;cursor:pointer}
.chart-box .selb{fill:var(--accent-soft);opacity:.6}
.chart-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:170px;z-index:2}
.chart-tip b{display:block;margin-bottom:4px}
.chart-tip .r{display:flex;justify-content:space-between;gap:14px}
.chart-tip .r span:last-child{font-family:var(--f-num)}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.note{font-size:12px;color:var(--muted)}
.bulk{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bulk .sel-tot{font-size:13px;opacity:.85;margin-right:6px}.bulk .sel-tot b{font-family:var(--f-num);opacity:1}
.bulk select{background:var(--bg);color:var(--fg);border:0}
.bulk .btn{background:var(--bg);color:var(--fg);border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;max-width:640px;width:100%;border:1px solid var(--line)}
.modal .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}

ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

<script>
/* =====================================================================
   CONTROL DE GASTOS · código principal (versión comentada)
   ---------------------------------------------------------------------
   CÓMO FUNCIONA, EN RESUMEN
   1. Datos: Supabase (base de datos + inicio de sesión + archivos).
      config.js trae la dirección y la llave pública. Los permisos los
      controla la base de datos (RLS): un usuario solo ve sus controles.
   2. Arranque: init() → arrancar() → cargarTodo() lee todo una vez y lo
      guarda en S (estado). derive() calcula D (datos derivados).
   3. Pantalla: render() dibuja la vista según el #hash de la dirección
      (route). Cada vista es una función vXxx() que devuelve HTML.
   4. Acciones: un solo "escuchador" de clics (más abajo, "acciones de la
      interfaz") revisa data-act="..." del botón tocado y ejecuta la acción.
      Igual para cambios (change), escritura (input) y teclas (keydown).
   5. Guardar: toda escritura usa q(sb.from('tabla')...) y luego actualiza
      S y vuelve a dibujar con render().

   DATOS PRINCIPALES
   - Registros de la app (Registro Contable) → tabla tx_mes, uno por mes.
     Se leen como "tx" (rowToTx) y viven en D.txs.
   - Movimientos asignados a controles → tabla movimientos (S.movs).
     Un registro de la app puede repartirse en varios movimientos.
   - Reparto mensual → resumen(): compartido ÷ participantes + individual.

   GLOSARIO DE NOMBRES CORTOS
   S = estado · D = derivados · c = control · m = movimiento ·
   t / tx = registro de la app · h = hoja del mes · R = resumen ·
   a = esAdmin() · q() = consulta a Supabase · $() = buscar elemento.
   ===================================================================== */
(() => {
'use strict';
/* ================= utilidades ================= */
// $: Atajo para buscar un elemento de la página: $("#id").
const $ = (s, el = document) => el.querySelector(s);
// esc: Escapa texto para insertarlo seguro en HTML (evita que un texto rompa la página).
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// NF: Formateador de números con 2 decimales y separador de miles (formato en-US).
const NF = new Intl.NumberFormat('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// L: Da formato de lempiras: L(1234.5) → "L 1,234.50" (negativos con signo).
const L = v => (v < 0 ? '-L ' : 'L ') + NF.format(Math.abs(v || 0));
// MES: Nombres de los meses en mayúsculas, índice 0 = ENERO.
const MES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
// mesLargo: Convierte "2026-11" en "Noviembre 2026".
const mesLargo = m => { if (!m || m === 'general') return 'Todo el proyecto'; const [y, mm] = m.split('-'); return MES[+mm - 1].charAt(0) + MES[+mm - 1].slice(1).toLowerCase() + ' ' + y; };
// mesHoja: Nombre de mes corto para pestañas de Excel.
const mesHoja = m => { const [y, mm] = m.split('-'); return `${y.slice(2)} ${mm} | ${MES[+mm - 1]}`; };
// fFecha: Convierte "2026-11-10" en "10/11/2026".
const fFecha = d => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '—';
// hoy: Fecha de hoy en formato "AAAA-MM-DD" (hora local).
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// cents: Redondea a centavos y devuelve un entero (para comparar montos sin errores de decimales).
const cents = v => Math.round(Math.abs(+v || 0) * 100);
// dias: Días entre dos fechas.
const dias = (a, b) => Math.abs((Date.parse(a) - Date.parse(b)) / 864e5);
// lsGet: Lee una preferencia guardada en el navegador (localStorage), con valor por defecto.
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
// lsSet: Guarda una preferencia en el navegador (localStorage).
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
let toastT;

function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600);
}
// app: Devuelve el contenedor principal donde se dibuja cada vista.

// sb: Cliente de Supabase: todas las lecturas y escrituras a la base de datos pasan por aquí.

// S: ESTADO GLOBAL de la app: usuario, controles, movimientos, filtros, selección, datos de módulos, etc.

// D: DATOS DERIVADOS (se recalculan con derive()): registros de la app (txs), índice por id y asignaciones.

// esAdmin: true si el usuario actual es administrador.

// ctrls: Lista de controles (centros de costo y proyectos) visibles.

// colorClass: Clase de color (punto de color) de un control.

// cerrado: true si el control/proyecto está cerrado (no admite cambios).

// familiares: Controles mensuales (Familia, Padres, Personales…).

// nombreDe: Nombre de una persona a partir de su id de usuario.

// fromC: Convierte un control tal como viene de la base de datos al formato que usa la app.
const fromC = r => ({id: r.id, nombre: r.nombre, corto: r.corto || r.nombre, porMes: r.tipo === 'mensual', personas: r.personas || [], categorias: r.categorias || [], incluye: r.incluye || '', excluye: r.excluye || '', tipoDefecto: r.tipo_defecto || 'COMPARTIDO', sugerirPorNombre: !!r.sugerir_por_nombre, color: r.color || 'a', estado: r.estado || 'abierto', abiertoEl: r.abierto_el, cerradoEl: r.cerrado_el, orden: r.orden || 0, personasMes: r.personas_mes || {}});
// toC: Convierte un control de la app al formato de la base de datos para guardarlo.
const toC = c => ({id: c.id, nombre: c.nombre, corto: c.corto || c.nombre, tipo: c.porMes ? 'mensual' : 'proyecto', personas: c.personas, categorias: c.categorias, incluye: c.incluye, excluye: c.excluye, tipo_defecto: c.tipoDefecto, sugerir_por_nombre: c.sugerirPorNombre, color: c.color, estado: c.estado, abierto_el: c.abiertoEl || null, cerrado_el: c.cerradoEl || null, orden: c.orden || 0, personas_mes: c.personasMes || {}});
// normMov: Normaliza un movimiento leído de la base (números, fechas, campos vacíos).
const normMov = m => Object.assign({}, m, {valor: +m.valor || 0, fecha: m.fecha ? String(m.fecha).slice(0, 10) : null, app_monto: m.app_monto == null ? null : +m.app_monto, app_fecha: m.app_fecha ? String(m.app_fecha).slice(0, 10) : null});

// rowToTx: Convierte una fila de Registro Contable [id, fecha, código, cuenta, …, monto] en un objeto "tx". Aplica la moneda extranjera si se importó.
function rowToTx(r) {
  const [id, fecha, code, cuenta, tipoMov, cat, sub, nota, det, monto] = r;
  const t = {id, fecha, code, cuenta, tipoMov, cat: (cat || '').trim(), sub: (sub || '').trim(), nota: (nota || '').trim(), det: (det || '').trim(), monto: Math.abs(+monto || 0), mes: fecha.slice(0, 7)};
  t.montoApp = t.monto; if (r[10] && typeof r[10] === 'object') t.x = r[10];   // datos extra del portal
  const fx = S.mon && S.mon.get(id);
  if (fx && fx.moneda && fx.moneda !== 'HNL' && +fx.original) { t.moneda = fx.moneda; t.original = Math.abs(+fx.original); t.monto = Math.abs(+fx.hnl); t.tasa = Math.round(t.monto / t.original * 10000) / 10000; }
  else if (/\$\s*$/.test((cuenta || '').trim())) t.sinTasa = true;
  return t;
}
// decisionDe: Lee del historial de sincronización si un registro fue borrado en la app o se decidió conservar la versión web.
function decisionDe(id) {
  const h = S.hist && S.hist.get(id); const l = (h && h.cambios) || []; let borrado = null, web = null;
  for (const e of l) {
    if (e.borrado) borrado = e.decision === 'mantener' ? e : null;
    if (e.reaparece) borrado = null;
    if (e.d || e.decision) { if (!e.borrado) web = e.decision === 'web' ? e : null; }
  }
  return {borrado, web};
}
// derive: Recalcula D: arma la lista de registros de la app (txs) a partir de los meses sincronizados y cuánto de cada uno ya está asignado.
function derive() {
  const txs = [];
  for (const [, doc] of S.tx) for (const r of (doc.rows || [])) {
    const t = rowToTx(r); const dc = decisionDe(t.id);
    if (dc.borrado) t.borradoApp = dc.borrado.at; if (dc.web) t.versionWeb = dc.web;
    txs.push(t);
  }
  txs.sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0);
  const asig = new Map(); for (const m of S.movs.values()) if (m.tx_id && m.estado !== 'rechazado') { if (!asig.has(m.tx_id)) asig.set(m.tx_id, []); asig.get(m.tx_id).push(m); }
  D = {txs, byId: new Map(txs.map(t => [t.id, t])), asig};
}
// partes: Partes (movimientos) en que se asignó un registro de la app.
const partes = id => D.asig.get(id) || [];
// asignado: Total ya asignado de un registro de la app.
const asignado = id => partes(id).reduce((s, m) => s + (+m.valor || 0), 0);
// restante: Lo que falta por asignar de un registro de la app (monto − asignado).
const restante = t => Math.round((t.monto - asignado(t.id)) * 100) / 100;
// snapApp: Foto de los datos del registro de la app al momento de asignarlo (para detectar cambios después).
const snapApp = t => ({app_monto: t.monto, app_fecha: t.fecha, app_detalle: t.det, app_cuenta: t.cuenta, app_categoria: t.cat});
// personasDe: Participantes de un control en un mes: los del mes si se cambiaron, si no "los de siempre".
const personasDe = (c, mes) => { if (!c) return []; const pm = c.personasMes || {}; return c.porMes && mes && Array.isArray(pm[mes]) ? pm[mes] : (c.personas || []); };
// cambioDe: Detecta si un movimiento asignado cambió o se borró en la app, o si está duplicado / asignado de más.
function cambioDe(m) {
  if (!esAdmin() || !m.tx_id || m.estado === 'rechazado') return null;
  const t = D.byId.get(m.tx_id);
  if (!t) { const mes = (m.app_fecha || m.fecha || '').slice(0, 7); return S.tx.has(mes) ? {tipo: 'eliminado'} : null; }
  const pp = partes(t.id);
  if (pp.length > 1 && asignado(t.id) > t.monto + 0.005) {
    const orden = [...pp].sort((x, y) => (x.creado_el || '') < (y.creado_el || '') ? -1 : (x.creado_el || '') > (y.creado_el || '') ? 1 : (x.id < y.id ? -1 : 1));
    const firma = x => [x.control, x.mes, x.tipo, cents(x.valor)].join('|');
    const i = orden.findIndex(x => x.id === m.id);
    if (orden.slice(0, i).some(x => firma(x) === firma(m))) return {tipo: 'duplicado', t, total: asignado(t.id)};
    const hayDup = orden.some((x, j) => orden.slice(0, j).some(y => firma(y) === firma(x)));
    if (!hayDup && i === 0) return {tipo: 'excedido', t, total: asignado(t.id)};
  }
  if (m.app_monto == null) return null;
  const d = [];
  if (cents(t.monto) !== cents(m.app_monto)) d.push(['Monto', L(m.app_monto), L(t.monto)]);
  if (m.app_fecha && t.fecha !== m.app_fecha) d.push(['Fecha', fFecha(m.app_fecha), fFecha(t.fecha)]);
  if (m.app_detalle != null && t.det !== m.app_detalle) d.push(['Detalle', m.app_detalle, t.det]);
  if (m.app_cuenta && t.cuenta !== m.app_cuenta) d.push(['Cuenta', m.app_cuenta, t.cuenta]);
  if (m.app_categoria && t.cat !== m.app_categoria) d.push(['Categoría', m.app_categoria, t.cat]);
  return d.length ? {tipo: 'modificado', d, t} : null;
}
// cambios: Lista de movimientos con cambios pendientes de revisar (vista "Cambios").
const cambios = () => esAdmin() ? [...S.movs.values()].map(m => ({m, c: cambioDe(m)})).filter(x => x.c).sort((a, b) => (a.m.fecha || '') < (b.m.fecha || '') ? -1 : 1) : [];
// applies: true si un registro de la app cumple las reglas (categorías, cuentas, fechas) de un control.
function applies(c, t) {
  const cat = (t.cat || '').trim();
  if (cerrado(c)) return false;
  const cats = (c.categorias || []).filter(Boolean);
  if (esProy(c) && !c.incluye) return false;
  if (!cats.length && !esProy(c)) return false;
  if (cats.length && !cats.some(p => cat.startsWith(p))) return false;
  const hay = (t.det + ' ' + t.nota + ' ' + t.sub).toUpperCase();
  if (c.incluye && !hay.includes(c.incluye.toUpperCase())) return false;
  if (c.excluye && t.det.toUpperCase().includes(c.excluye.toUpperCase())) return false;
  return true;
}
// sugerido: Control sugerido para un registro de la app según las reglas.
const sugerido = t => proyectos().find(c => applies(c, t)) || familiares().find(c => applies(c, t));
// tipoSugerido: Tipo (COMPARTIDO o persona) sugerido para un registro según su texto y el control.
function tipoSugerido(c, t) {
  if (!c) return '';
  if (c.sugerirPorNombre) { const d = t.det.toUpperCase(); const p = personasDe(c, t.mes).find(p => d.includes(p.toUpperCase()) || d.includes(p.split(' ')[0].toUpperCase())); if (p) return p; }
  if (t.code === 0) return personasDe(c, t.mes)[0] || '';

}
// estadoTx: Estado de un registro de la app: sin asignar, parcial, asignado, ignorado…
function estadoTx(t) {

// errMsg: Traduce errores de Supabase a mensajes entendibles.
function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/row-level security/i.test(m)) return 'No tienes permiso para hacer ese cambio.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión con la base de datos. Revisa tu internet.';
  if (/JWT expired/i.test(m)) return 'Tu sesión expiró. Vuelve a entrar.';
  return m;
}
// q: Ejecuta una consulta de Supabase; si falla muestra el error, si sale bien puede mostrar un aviso.
async function q(promesa, okMsg) {
  const {data, error} = await promesa;
  if (error) { toast(errMsg(error)); throw error; }
  if (okMsg) toast(okMsg);
  return data;
}
// todo: Lee una tabla completa en bloques de 1,000 filas.
async function todo(tabla, orden) {
  const out = [];
  for (let a = 0; ; a += 1000) {
    let qq = sb.from(tabla).select('*'); if (orden) qq = qq.order(orden);
    const {data, error} = await qq.range(a, a + 999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break;
  }
  return out;
}
// cargarTodo: CARGA INICIAL: perfil del usuario, controles, movimientos, adjuntos, micro proyectos, vehículos y, si es admin, datos de la app, ajustes, usuarios y créditos.
async function cargarTodo() {
  const {data: u} = await sb.auth.getUser();
  const uid = u && u.user && u.user.id;
  const {data: me, error} = await sb.from('perfiles').select('*').eq('id', uid).maybeSingle();
  if (error) throw error;
  S.me = me || {id: uid, email: u.user.email, activo: false, rol: 'usuario'};
  if (!S.me.activo) return;
  const [ctr, movs] = await Promise.all([todo('controles', 'orden'), todo('movimientos', 'creado_el')]);
  S.ctrls = ctr.map(fromC); S.movs = new Map(movs.map(m => [m.id, normMov(m)]));
  try { S.adj = await todo('adjuntos', 'subido_el'); } catch (e) { S.adj = null; }
  try { S.micro = await todo('microproyectos', 'creado_el'); } catch (e) { S.micro = null; }
  try { S.veh = await todo('vehiculos', 'creado_el'); S.vreg = await todo('veh_registros', 'fecha'); S.vplan = await todo('veh_planes'); } catch (e) { S.veh = null; S.vreg = null; S.vplan = null; }
  if (esAdmin()) {
    const [tx, ign, aj, pf, ac] = await Promise.all([todo('tx_mes', 'mes'), todo('ignorados'), todo('ajustes'), todo('perfiles', 'creado_el'), todo('accesos')]);
    S.tx = new Map(tx.map(t => [t.mes, t])); S.ign = new Map(ign.map(i => [i.tx_id, i]));
    S.aj = Object.fromEntries(aj.map(a => [a.clave, a.valor])); S.perfiles = pf; S.accesos = ac;
    if (!S.aj.inicio) S.aj.inicio = hoy().slice(0, 8) + '01';
    try { S.hist = new Map((await todo('tx_hist')).map(x => [x.tx_id, x])); } catch (e) { S.hist = null; }
    try { S.mon = new Map((await todo('tx_moneda')).map(x => [x.tx_id, x])); } catch (e) { S.mon = null; }
    try { const [cr, cq, ce] = await Promise.all([todo('creditos', 'nombre'), todo('credito_cuotas', 'numero'), todo('credito_enlaces')]); S.cred = cr; S.ccuo = cq; S.cenl = ce; } catch (e) { S.cred = null; S.ccuo = []; S.cenl = []; }
    // Tarjetas de crédito (si aún no se corrió tarjetas.sql, S.tj queda en null y la pestaña lo avisa).
    try { const [tj, tp, tg] = await Promise.all([todo('tarjetas', 'banco'), todo('tarjeta_periodos', 'corte'), todo('tarjeta_pagos')]); S.tj = tj; S.tjp = tp; S.tjpg = tg; } catch (e) { S.tj = null; S.tjp = []; S.tjpg = []; }
  } else {
    S.tx = new Map(); S.ign = new Map(); S.aj = {}; S.perfiles = [S.me];
    S.accesos = await q(sb.from('accesos').select('*').eq('usuario', uid));
  }
}

// TEMA: 'auto' sigue al teléfono o la computadora; 'light' = Día (azul); 'dark' = Noche (negro). Se guarda en este navegador.
const TEMAS = ['auto', 'light', 'dark'];
const ICO_TEMA = {auto: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>'};
const NOM_TEMA = {auto: 'Automático', light: 'Día', dark: 'Noche'};
const temaActual = () => { const t = lsGet('tema'); return TEMAS.includes(t) ? t : 'auto'; };

  const t = temaActual(); const r = document.documentElement;

// init: Punto de entrada: revisa la configuración, la sesión y arranca la app.
async function init() {
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) return renderSetup();
  if (!window.supabase || !window.supabase.createClient) return fatal('No se pudo cargar la conexión con la base de datos. Revisa tu internet y recarga la página.');
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; renderAuth(); return; }
    if (ev === 'SIGNED_OUT' || !session) { S.me = null; renderAuth(); return; }
    if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && !S.recuperando && (!S.me || S.me.id !== session.user.id)) arrancar();
  });
}
// arrancando: Bandera para no arrancar dos veces.

// enviarAuth: Envía el formulario de entrada / registro / recuperar contraseña a Supabase.
async function enviarAuth(form) {
  const v = form.dataset.v; const msg = $('#authMsg'); const btn = form.querySelector('[type=submit]');
  const email = $('#aEmail') && $('#aEmail').value.trim(); const pass = $('#aPass') && $('#aPass').value;
  if ((v === 'login' || v === 'registro' || v === 'olvido') && !/^\S+@\S+\.\S+$/.test(email || '')) { msg.innerHTML = '<span class="neg">Escribe un correo válido.</span>'; return; }
  if ((v === 'registro' || v === 'nueva') && (pass || '').length < 8) { msg.innerHTML = '<span class="neg">La contraseña debe tener al menos 8 caracteres.</span>'; return; }
  btn.disabled = true; msg.textContent = 'Un momento…';
  const volver = location.origin + location.pathname;
  try {
    if (v === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) msg.innerHTML = `<span class="neg">${/confirm/i.test(error.message) ? 'Primero confirma tu correo con el enlace que te enviamos.' : 'Correo o contraseña incorrectos.'}</span>`;
    } else if (v === 'registro') {
      const {data, error} = await sb.auth.signUp({email, password: pass, options: {data: {nombre: $('#aNombre').value.trim()}, emailRedirectTo: volver}});
      if (error) msg.innerHTML = `<span class="neg">${esc(errMsg(error))}</span>`;
      else if (!data.session) msg.innerHTML = '<span class="pos">Listo. Te enviamos un correo para confirmar tu cuenta; ábrelo y luego entra aquí.</span>';
    } else if (v === 'olvido') {
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: volver});
      msg.innerHTML = error ? `<span class="neg">${esc(errMsg(error))}</span>` : '<span class="pos">Si el correo tiene cuenta, te llegará un enlace para crear una contraseña nueva.</span>';
    } else if (v === 'nueva') {
      const {error} = await sb.auth.updateUser({password: pass});
      if (error) msg.innerHTML = `<span class="neg">${esc(errMsg(error))}</span>`;
      else { S.recuperando = false; toast('Contraseña actualizada'); history.replaceState(null, '', location.pathname); arrancar(); }
    }
  } finally { btn.disabled = false; }
}

// resumen: CÁLCULO DEL REPARTO de un mes: compartido ÷ participantes + lo individual = total a pagar; saldo = total a pagar + abonos.
function resumen(c, h) {
  const val = r => r.estado === 'valido';
  const eg = h.egresos.filter(val), ing = h.ingresos.filter(val);
  const sum = (a, f) => a.filter(f).reduce((s, r) => s + (+r.valor || 0), 0);
  const ps = [...personasDe(c, h.mes)];
  eg.concat(ing).forEach(r => { if (r.tipo && r.tipo !== 'COMPARTIDO' && !ps.includes(r.tipo)) ps.push(r.tipo); });
  const comp = -sum(eg, r => r.tipo === 'COMPARTIDO') + sum(ing, r => r.tipo === 'COMPARTIDO');
  const n = Math.max(1, personasDe(c, h.mes).length || ps.length);
  const per = ps.map(p => { const g = -sum(eg, r => r.tipo === p); const r2 = x => Math.sign(x) * Math.round(Math.abs(x) * 100 + 1e-6) / 100; const pagar = r2(comp / n + g); const aporte = r2(sum(ing, r => r.tipo === p)); return {p, g, pagar, aporte, saldo: r2(pagar + aporte)}; });
  const todas = h.egresos.concat(h.ingresos);
  return {mes: h.mes, comp, per, n, ingreso: sum(ing, () => true), egreso: sum(eg, () => true), filas: todas.length, ligados: todas.filter(r => r.tx_id).length,
    pendientes: todas.filter(r => r.estado === 'pendiente').length, pendienteValor: h.egresos.filter(r => r.estado === 'pendiente').reduce((s, r) => s + r.valor, 0)};
}

/* ================= vista: bandeja (admin) ================= */
// vBandeja: VISTA BANDEJA (admin): registros de la app por asignar, con filtros y asignación masiva.
function vBandeja() {
  if (!D.txs.length) return `<div class="panel"><div class="empty"><b>Aún no hay movimientos de la app</b>Sincroniza con Registro Contable para traerlos.<div style="margin-top:12px"><button class="btn pri" data-act="sync">Sincronizar</button></div></div></div>`;
  const f = S.filtros; const qq = f.q.toUpperCase();
  const lista = D.txs.filter(t => {
    const e = estadoTx(t);
    if (!(e === 'pendiente' || (f.todos && e === 'otro'))) return false;
    if (f.ctrl) { const s = sugerido(t); if (f.ctrl === '_none' ? s : (!s || s.id !== f.ctrl)) return false; }
    if (f.mes && t.mes !== f.mes) return false;
    if (f.hasta && t.fecha > f.hasta) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.subc && t.sub !== f.subc) return false;
    if (f.nat && (f.nat === 'ingreso' ? t.code !== 0 : t.code === 0)) return false;
    if (f.cuenta && t.cuenta !== f.cuenta) return false;
    if (qq && !(t.det + ' ' + t.cat + ' ' + t.sub + ' ' + t.nota + ' ' + t.cuenta).toUpperCase().includes(qq)) return false;
    return true;
  });
  const bdef = {k: 'fecha', dir: 'asc'}; const lista0 = lista; lista.splice(0, lista.length, ...ordenarLista(lista0, ordDe('bandeja', bdef), {fecha: t => t.fecha, det: t => t.det, cuenta: t => t.cuenta, monto: t => restante(t)}));
  const porCtrl = {}; bandeja().forEach(t => { const s = sugerido(t); const k = s ? s.id : "_none"; porCtrl[k] = (porCtrl[k] || 0) + 1; });
  const total = lista.length; const shown = lista.slice(0, S.limite);
  const meses = [...new Set(D.txs.filter(t => estadoTx(t) === 'pendiente').map(t => t.mes))].sort().reverse();
  const cand = D.txs.filter(t => { const e = estadoTx(t); return e === 'pendiente' || (f.todos && e === 'otro'); });
  const ordN = (a, b) => a.localeCompare(b, 'es', {numeric: true});
  const catsB = [...new Set(cand.map(t => t.cat).filter(Boolean))].sort(ordN); if (f.cat && !catsB.includes(f.cat)) catsB.unshift(f.cat);
  const subsB = [...new Set(cand.filter(t => !f.cat || t.cat === f.cat).map(t => t.sub).filter(Boolean))].sort(ordN); if (f.subc && !subsB.includes(f.subc)) subsB.unshift(f.subc);
  const cuentas = [...new Set(cand.filter(t => (!f.cat || t.cat === f.cat) && (!f.subc || t.sub === f.subc)).map(t => t.cuenta).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  if (f.cuenta && !cuentas.includes(f.cuenta)) cuentas.unshift(f.cuenta);
  const hayFiltro = f.q || f.ctrl || f.mes || f.nat || f.cuenta || f.hasta || f.cat || f.subc;
  return `<div class="stack">
    <div class="row" style="justify-content:space-between;align-items:flex-end">

      <div class="note">Movimientos de la app desde ${fFecha(S.aj.inicio)} que coinciden con las reglas de algún control y todavía no están en ninguno.</div></div>
      <div class="row small">${abiertos().map(c => `<span class="chip"><span class="dot ${colorClass(c)}"></span>${esc(c.corto || c.nombre)} · ${porCtrl[c.id] || 0}</span>`).join('')}</div>
    </div>

        <select id="fcat" aria-label="Categoría"><option value="">Todas las categorías</option>${catsB.map(x => `<option value="${esc(x)}" ${f.cat === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        <select id="fsubc" aria-label="Subcategoría"><option value="">Todas las subcategorías</option>${subsB.map(x => `<option value="${esc(x)}" ${f.subc === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        <select id="fnat" aria-label="Naturaleza"><option value="">Ingresos y egresos</option><option value="egreso" ${f.nat === 'egreso' ? 'selected' : ''}>Solo egresos</option><option value="ingreso" ${f.nat === 'ingreso' ? 'selected' : ''}>Solo ingresos</option></select>
        <select id="fcuenta" aria-label="Cuenta"><option value="">Todas las cuentas</option>${cuentas.map(c => `<option value="${esc(c)}" ${f.cuenta === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        ${hayFiltro ? '<button class="btn sm ghost" data-act="limpiarFiltros">Quitar filtros</button>' : ''}
        <label class="small row" style="gap:6px"><input type="checkbox" id="ftodos" ${f.todos ? 'checked' : ''}> Incluir movimientos sin sugerencia</label>
      </div>

      ${total ? `<div class="tbl-wrap"><table>

        <tbody>${shown.map(t => `<tr data-tx="${esc(t.id)}"><td><input type="checkbox" data-sel="${esc(t.id)}" ${S.sel.has(t.id) ? 'checked' : ''} aria-label="Seleccionar"></td>${txCells(t)}${asignarCells(t)}</tr>`).join('')}</tbody></table></div>
        ${total > shown.length ? `<div class="bd"><button class="btn" data-act="mas">Mostrar ${Math.min(300, total - shown.length)} más (${total - shown.length} restantes)</button></div>` : ''}`
      : `<div class="empty"><b>No hay movimientos con estos filtros</b>Cuando sincronices, aquí aparecen los nuevos registros de la app.</div>`}
    </div>
    ${S.sel.size ? `<div class="bulk" role="region" aria-label="Acciones para la selección"><b>${S.sel.size} seleccionados</b>${(() => { let ing = 0, egr = 0; S.sel.forEach(id => { const t = D.byId.get(id); if (!t) return; const v = restante(t); t.code === 0 ? ing += v : egr += v; }); const r = x => Math.round(x * 100) / 100; return `<span class="sel-tot">${egr ? `Egresos <b class="num">${L(r(egr))}</b>` : ''}${ing && egr ? ' · ' : ''}${ing ? `Ingresos <b class="num">${L(r(ing))}</b>` : ''}</span>`; })()}

  </div>`;
}

/* ================= vista: por validar (admin) ================= */
// candidatos: Registros de la app parecidos a un movimiento pendiente (para validar).
function candidatos(m) {
  const v = Math.abs(m.valor);
  return D.txs.filter(t => restante(t) > 0.005 && !S.ign.has(t.id) && t.code !== 3 && m.fecha && (
    (cents(t.monto) === cents(v) && dias(t.fecha, m.fecha) <= 20) || (dias(t.fecha, m.fecha) <= 3 && Math.abs(t.monto - v) <= 0.05 * v)))
    .sort((a, b) => (cents(a.monto) === cents(v) ? 0 : 1) - (cents(b.monto) === cents(v) ? 0 : 1) || dias(a.fecha, m.fecha) - dias(b.fecha, m.fecha)).slice(0, 5);
}

    <td class="mono small">${fFecha(m.fecha)}</td><td class="small">${esc(nombreDe(m.creado_por))}<div class="cat">${new Date(m.creado_el).toLocaleDateString('es-HN')}</div></td>

      ${cand.length ? cand.map(t => `<div class="row small" style="gap:10px"><span class="mono">${fFecha(t.fecha)}</span><span style="flex:1;min-width:180px">${esc(t.det)} <span class="cat">${esc(t.cuenta)}</span></span><span class="num">${L(t.monto)}</span><button class="btn sm pri" data-act="ligarTx" data-tx="${esc(t.id)}">Ligar</button></div>`).join('') : '<div class="small muted">No encontré registros parecidos sin asignar. Puedes aprobarlo como manual.</div>'}</div></td></tr>` : ''}
    ${S.rechazoAbierto === m.id ? `<tr class="addrow"><td colspan="${conControl ? 7 : 6}"><div class="row"><input class="in" id="notaRechazo" style="max-width:none;flex:1" placeholder="Motivo (lo verá quien lo registró)"><button class="btn sm danger" data-act="confirmarRechazo">Rechazar</button></div></td></tr>` : ''}`;
}

    ${c.porMes ? `${vSelMes(c, mes, meses)}

      <div class="kpi"><div class="eyebrow">Por validar</div><div class="v ${R.pendientes ? 'warn-t' : ''}">${R.pendientes}</div></div>

    ${tablaFilas(c, h, 'egreso')}${tablaFilas(c, h, 'ingreso')}
    ${c.porMes ? vMicros(c, mes) : ''}
    ${a && esProy(c) ? vConfigProy(c) : ''}</div>`;

// porMesProy: Totales por mes de un proyecto.
function porMesProy(h) {
  const val = r => r.estado === 'valido'; const g = new Map();
  const add = (r, k) => { const m = (r.fecha || '').slice(0, 7) || 'sin-fecha'; if (!g.has(m)) g.set(m, {mes: m, ing: 0, eg: 0, n: 0}); const x = g.get(m); x[k] += +r.valor || 0; x.n++; };
  h.egresos.filter(val).forEach(r => add(r, 'eg')); h.ingresos.filter(val).forEach(r => add(r, 'ing'));
  let acc = 0; return [...g.values()].sort((a, b) => a.mes < b.mes ? -1 : 1).map(x => { acc += x.ing - x.eg; return Object.assign(x, {saldo: x.ing - x.eg, acum: acc}); });
}
// serieProy: Serie de datos para el gráfico de un proyecto.
function serieProy(c, h) {
  const l = porMesProy(h).filter(x => x.mes !== 'sin-fecha'); const modo = lsGet('graf-' + c.id) || 'acum';
  let ai = 0, ae = 0;
  return {modo, puntos: l.map(x => { ai += x.ing; ae += x.eg; return modo === 'acum' ? {mes: x.mes, i: ai, e: ae, s: ai - ae, n: x.n, mi: x.ing, me: x.eg} : {mes: x.mes, i: x.ing, e: x.eg, s: x.saldo, n: x.n, mi: x.ing, me: x.eg}; })};
}
// vResumenProy: Resumen y gráfico de un proyecto largo.
function vResumenProy(c, R, h) {
  const {modo, puntos} = serieProy(c, h); const sel = ((S.ftab || {})[c.id + '|egreso'] || {}).mes || '';

  for (let k = 0; k < n - 1; k++) { const h3 = dx[k] / 3; d += `C${(p[k][0] + h3).toFixed(1)},${(p[k][1] + t[k] * h3).toFixed(1)} ${(p[k + 1][0] - h3).toFixed(1)},${(p[k + 1][1] - t[k + 1] * h3).toFixed(1)} ${p[k + 1][0].toFixed(1)},${p[k + 1][1].toFixed(1)}`; }
  return d;
}

  return [...l].sort((a, b) => { const x = g(a), y = g(b); const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'es', {numeric: true, sensitivity: 'base'}); return c * f || String(a.fecha || '').localeCompare(String(b.fecha || '')) * f; });
}

  S.rep = {t, partes: ps, borrar: []}; pintarReparto();
}

// guardarReparto: Guarda las partes del reparto (control, micro proyecto, tipo, mes, monto).
async function guardarReparto() {
  const {t, partes: ps, borrar} = S.rep; const lado = t.code === 0 ? 'ingreso' : 'egreso';
  if (ps.some(p => !(+p.valor > 0))) return toast('Cada parte necesita un monto mayor que cero.');
  if (ps.some(p => !p.id && cerrado(ctrlById(p.control)))) return toast('No puedes agregar partes a un proyecto cerrado.');
  try {
    for (const id of borrar) { await q(sb.from('movimientos').delete().eq('id', id)); S.movs.delete(id); }
    const nuevos = [];
    for (const p of ps) {
      const c = ctrlById(p.control); const mes = c.porMes ? (p.mes === 'general' ? t.mes : p.mes) : 'general';
      if (p.id) {
        const o = p.orig; const ch = {};
        if (o.control !== p.control) ch.control = p.control; if (o.tipo !== p.tipo) ch.tipo = p.tipo; if (o.mes !== mes) ch.mes = mes; if (cents(o.valor) !== cents(p.valor)) ch.valor = +p.valor; const g = c.porMes ? (p.grupo || null) : null; if ((o.grupo || null) !== g) ch.grupo = g;
        if (Object.keys(ch).length) { const d = await q(sb.from('movimientos').update(ch).eq('id', p.id).select()); if (d && d[0]) S.movs.set(p.id, normMov(d[0])); }
      } else nuevos.push({control: c.id, mes, lado, fecha: t.fecha, tipo: p.tipo, cat: lado === 'ingreso' ? '' : t.sub, sub: lado === 'ingreso' ? '' : t.nota, descripcion: t.det, detalle: '', valor: +p.valor, tx_id: t.id, estado: 'valido', origen: 'app', validado_por: S.me.id, validado_el: new Date().toISOString(), ...snapApp(t), ...(c.porMes && p.grupo ? {grupo: p.grupo} : {})});
    }
    if (nuevos.length) { const d = await q(sb.from('movimientos').insert(nuevos).select()); (d || []).forEach(m => S.movs.set(m.id, normMov(m))); }
  } catch (e) { derive(); render(); return; }
  S.rep = null; $('#modalRoot').innerHTML = ''; derive(); render(); toast('Reparto guardado');
}

/* ================= vehículos ================= */
// GALON: Litros por galón.
const GALON = 3.78541;
// vUnidad: Unidad de volumen elegida (litros o galones).
const vUnidad = () => lsGet('veh-unidad') === 'G' ? 'G' : 'L';
// vVol: Convierte un volumen a la unidad elegida.
const vVol = l => vUnidad() === 'L' ? l : l / GALON;
// vU: Nombre de la unidad (L o gal).
const vU = () => vUnidad() === 'L' ? 'L' : 'gal';
// vRU: Unidad de rendimiento (km/L o km/gal).
const vRU = () => vUnidad() === 'L' ? 'km/L' : 'km/gal';
// vR: Convierte rendimiento a la unidad elegida.
const vR = r => vUnidad() === 'L' ? r : r * GALON;
// nf: Formato de número sin moneda.
const nf = (v, d = 0) => (+v || 0).toLocaleString('es-HN', {minimumFractionDigits: d, maximumFractionDigits: d});
// vehs: Vehículos visibles.
const vehs = () => (S.veh || []).filter(v => v.activo !== false);
// vehById: Busca un vehículo por id.
const vehById = id => (S.veh || []).find(v => v.id === id);
// regsDe: Registros (combustible, mantenimiento, recorridos) de un vehículo.
const regsDe = (id, tipo) => (S.vreg || []).filter(r => r.vehiculo === id && (!tipo || r.tipo === tipo)).sort((a, b) => (a.fecha + String(a.odometro || 0).padStart(9, '0')) < (b.fecha + String(b.odometro || 0).padStart(9, '0')) ? -1 : 1);
// lineasDe: Líneas de costo de un registro de mantenimiento.

function recargas(v) {

function vPorMes(v) {

const NORM = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

function tipoDetectado(t) { const c = NORM([t.cat, t.sub, t.nota].join(' ')); if (/COMBUSTIBLE|GASOLINA|DIESEL/.test(c)) return 'combustible'; if (/MANTEN|REPARAC|TALLER|REPUESTO|LLANTA|ACEITE|LUBRIC/.test(c)) return 'mantenimiento'; return null; }

function detectados() {

// crUsadas: Registros que ya están enlazados a alguna cuota (para no sugerirlos de nuevo).
function crUsadas() { const s = new Set(); (S.cenl || []).forEach(e => s.add(refKey(e))); return s; }
// crRango: rango de fechas para buscar registros de una cuota. Por defecto va del día siguiente a la cuota anterior hasta la fecha de la cuota
// (el período que paga esa cuota). Se puede cambiar con "Del / al" en la ventana; al pasar a otra cuota vuelve al período de esa cuota.
function crRango(q) {
  if (S.concRango && S.concRango.q === q.id) return S.concRango;
  const cs = cuotasDe(q.credito); const i = cs.findIndex(x => x.id === q.id);
  const sig = d => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + 1); return x.toISOString().slice(0, 10); };
  const desde = i > 0 ? sig(cs[i - 1].fecha) : sig(crAddM(q.fecha, -1));
  return (S.concRango = {q: q.id, desde, hasta: q.fecha, def: true});

// crCandidatos: registros que se pueden vincular a una cuota. Por defecto: sin vincular, de la fecha de la cuota (± días elegidos)
// y del crédito (misma cuenta o con su texto). "Cualquier fecha" quita el filtro de fecha; con "solo del crédito" apagado muestra todos; el buscador filtra por texto o monto.
function crCandidatos(c, q) {
  const o = S.concOpt || {}; const usadas = crUsadas(); const pat = (c.patron || '').trim().toUpperCase(); const f0 = new Date(q.fecha + 'T12:00');
  const bus = (o.q || '').trim().toUpperCase(); const n = parseFloat(bus.replace(/[^0-9.]/g, '')); const R = crRango(q);
  const fuera = f => !f || f < R.desde || f > R.hasta;
  const out = []; const dd = f => Math.abs((new Date((f || hoy()) + 'T12:00') - f0) / 864e5);
  for (const t of D.txs) {
    if (usadas.has('t:' + t.id)) continue;
    const txt = [t.nota, t.det, t.cat, t.sub, t.cuenta].join(' ').toUpperCase(); const d = dd(t.fecha);
    if (!o.todas && fuera(t.fecha)) continue;
    const delCred = (pat && txt.includes(pat)) || (c.cuenta && t.cuenta === c.cuenta);
    if (o.soloCred !== false && !delCred && !bus) continue;
    if (bus && !(txt.includes(bus) || (isFinite(n) && Math.abs(t.monto - n) < 0.01))) continue;
    if (!bus && t.code === 0 && !(pat && txt.includes(pat))) continue;   // ingresos solo si se buscan o traen el texto del crédito
    out.push({ref: 't:' + t.id, desc: [t.nota, t.det].filter(Boolean).join(' | ') || t.cat, sub: t.sub || t.cat, fecha: t.fecha, cuenta: t.cuenta, monto: t.monto, origen: 'App', d, p: pat && txt.includes(pat) ? 0 : delCred ? 1 : 2});
  }
  for (const m of S.movs.values()) {
    if (m.tx_id || m.estado === 'rechazado' || usadas.has('m:' + m.id)) continue;
    const txt = (m.descripcion || '').toUpperCase(); const d = dd(m.fecha);
    if (!o.todas && fuera(m.fecha)) continue;
    const delCred = !!(pat && txt.includes(pat));
    if (o.soloCred !== false && !delCred && !bus) continue;
    if (bus && !(txt.includes(bus) || (isFinite(n) && Math.abs((+m.valor || 0) - n) < 0.01))) continue;

// crGrafCosto: costo por crédito (interés, seguro, comisiones y mora) proyectado contra real, en barras horizontales.

function crNum(s) { s = String(s || '').trim(); if (!s) return 0; const neg = /^\(.*\)$/.test(s) || /^-/.test(s); s = s.replace(/[^0-9.,]/g, ''); if (/,\d{2}$/.test(s) && !/\.\d{2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); const v = parseFloat(s) || 0; return neg ? -v : v; }
// crFechaTxt: Lee una fecha pegada (dd/mm/aaaa o aaaa-mm-dd).
function crFechaTxt(s) { s = String(s || '').trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; } return null; }
// crParsePlan: Convierte el texto pegado del banco en filas de cuotas.
function crParsePlan(txt) {
  const out = [];
  for (const ln of String(txt || '').split(/\r?\n/)) { const cols = ln.split(/\t|;|\s{2,}/).map(x => x.trim()).filter(x => x !== ''); if (cols.length < 4) continue;
    const num = parseInt(cols[0], 10); const fecha = crFechaTxt(cols[1]); if (!isFinite(num) || !fecha) continue;
    const v = cols.slice(2).map(crNum); const [capital, interes, seguro = 0, comisiones = 0, mora = 0] = v;
    out.push({numero: num, fecha, capital: crR2(capital), interes: crR2(interes), seguro: crR2(seguro), comisiones: crR2(comisiones), mora: crR2(mora)}); }
  out.sort((a, b) => a.numero - b.numero); return out;
}

// prevPegar: Vista previa de las cuotas reconocidas al pegar.
function prevPegar() {
  const filas = crParsePlan($('#pegTxt').value); const b = document.querySelector('[data-act=pegGuardar]');
  b.disabled = !filas.length;
  $('#pegPrev').innerHTML = filas.length ? `<b>${filas.length} cuotas reconocidas</b> · de la ${filas[0].numero} (${fFecha(filas[0].fecha)}) a la ${filas[filas.length - 1].numero} (${fFecha(filas[filas.length - 1].fecha)}) · capital ${L(filas.reduce((s, f) => s + f.capital, 0))} · interés ${L(filas.reduce((s, f) => s + f.interes, 0))}` : 'No se reconoce ninguna fila. Revisa que la primera columna sea el número de cuota y la segunda la fecha.';

// guardarPegar: Reemplaza el plan con el pegado del banco.
async function guardarPegar() {
  const c = credById($('#pegF').dataset.id); const filas = crParsePlan($('#pegTxt').value); if (!filas.length) return;
  let saldo = +c.capital || 0; for (const f of filas) { saldo = crR2(saldo - f.capital); f.saldo = Math.max(0, saldo); f.cuota = crR2(f.capital + f.interes + f.seguro + f.comisiones + (f.mora || 0)); }
  $('#modalRoot').innerHTML = '';

// resumenMicro: Totales y meses de un micro proyecto.
function resumenMicro(id) {
  const rows = [...S.movs.values()].filter(m => m.grupo === id && m.estado === 'valido');

// adjDeTx: Comprobantes de un registro de la app.
const adjDeTx = id => (S.adj || []).filter(x => x.tx_id === id || (!x.tx_id && partes(id).some(p => p.id === x.mov_id)));

// tam: Tamaño de archivo legible (KB, MB).
const tam = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

      <div class="nm"><b title="${esc(x.nombre)}">${esc(x.nombre)}</b><span class="cat">${tam(+x.tamano || 0)} · ${esc(nombreDe(x.subido_por))} · ${cuando(x.subido_el)}</span></div>

    ${puedeSubir ? `<label class="btn sm" style="align-self:flex-start">Adjuntar comprobante<input type="file" hidden multiple accept="image/*,application/pdf" data-adj-up data-tx="${esc(destino.tx || '')}" data-mov="${esc(destino.mov || '')}" data-veh="${esc(destino.veh || '')}" data-vehiculo="${esc(destino.vehiculo || '')}"></label>

// cargarMiniaturas: Carga las miniaturas de imágenes desde Storage.
async function cargarMiniaturas() {
  for (const el of document.querySelectorAll('#modalRoot [data-thumb]')) {
    try { const {data} = await sb.storage.from('comprobantes').createSignedUrl(el.dataset.thumb, 600); if (data && data.signedUrl) el.innerHTML = `<img src="${esc(data.signedUrl)}" alt="">`; } catch (_) {}

// reabrirDetalle: Vuelve a abrir la ficha después de subir o quitar archivos.
function reabrirDetalle() { const d = S.detAbierto; if (!d) return; if (d.tipo === 'vreg') return abrirRegModal(d.rt, d.id); if (d.tipo === 'tx') abrirDetalleTx(d.id); else abrirDetalle(d.id); }
// subirAdjuntos: Sube archivos al Storage "comprobantes" y los registra.
async function subirAdjuntos(files, tx, mov, vreg, vehiculo) {
  const ok = []; for (const f of files) {
    if (f.size > 10485760) { toast(`${f.name}: pesa más de 10 MB`); continue; }
    if (!/^image\//.test(f.type) && f.type !== 'application/pdf') { toast(`${f.name}: solo imágenes o PDF`); continue; }
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    const ext = (f.name.match(/\.[a-z0-9]{1,5}$/i) || [''])[0].toLowerCase();
    const ruta = vreg ? `v/${vehiculo}/${id}${ext}` : `${mov ? 'm/' + mov : 't/' + tx}/${id}${ext}`;
    toast(`Subiendo ${f.name}…`);
    const up = await sb.storage.from('comprobantes').upload(ruta, f, {contentType: f.type, upsert: false});
    if (up.error) { toast('No se pudo subir: ' + errMsg(up.error)); continue; }
    try { const d = await q(sb.from('adjuntos').insert({id, tx_id: tx || null, mov_id: mov || null, ...(vreg ? {veh_reg: vreg} : {}), nombre: f.name, ruta, tipo: f.type, tamano: f.size, subido_por: S.me.id}).select()); if (d && d[0]) { S.adj.push(d[0]); ok.push(d[0]); } }
    catch (e) { await sb.storage.from('comprobantes').remove([ruta]); }
  }
  if (ok.length) toast(ok.length === 1 ? 'Comprobante adjuntado' : `${ok.length} comprobantes adjuntados`);
  render(); reabrirDetalle();
}
// quitarAdjunto: Borra un comprobante.
async function quitarAdjunto(id, silencio) {
  const x = (S.adj || []).find(z => z.id === id); if (!x) return;
  await sb.storage.from('comprobantes').remove([x.ruta]);
  await q(sb.from('adjuntos').delete().eq('id', id), silencio ? undefined : 'Comprobante quitado');
  S.adj = S.adj.filter(z => z.id !== id);
}
// ligarAdjuntos: Vincula comprobantes al registro de la app cuando se asocia una fila manual.
async function ligarAdjuntos(movId, txId) {
  const l = (S.adj || []).filter(x => x.mov_id === movId && !x.tx_id); if (!l.length) return;
  const d = await q(sb.from('adjuntos').update({tx_id: txId}).eq('mov_id', movId).is('tx_id', null).select());
  (d || []).forEach(n => { const i = S.adj.findIndex(z => z.id === n.id); if (i >= 0) S.adj[i] = n; });
}

// candidatosAsoc: Registros de la app candidatos para asociar.
function candidatosAsoc(m, qq) {
  const v = Math.abs(+m.valor || 0); const code = m.lado === 'ingreso' ? 0 : 1; const Q = (qq || '').trim().toUpperCase();
  const num = parseFloat(Q.replace(/[^0-9.]/g, ''));
  let l = D.txs.filter(t => t.code === code && restante(t) > 0.005 && !S.ign.has(t.id));
  if (Q) l = l.filter(t => (t.det + ' ' + t.cat + ' ' + t.sub + ' ' + t.nota + ' ' + t.cuenta + ' ' + fFecha(t.fecha)).toUpperCase().includes(Q) || (isFinite(num) && Math.abs(restante(t) - num) < 0.01));
  const pts = t => (cents(restante(t)) === cents(v) ? 0 : Math.min(9, Math.abs(restante(t) - v) / Math.max(v, 1) * 20)) + (m.fecha ? Math.min(30, dias(t.fecha, m.fecha)) / 3 : 5);
  return l.sort((a, b) => pts(a) - pts(b)).slice(0, 25);
}

// nombresPersonas: Nombres de personas usados (movimientos, participantes, perfiles) y aviso de nombres parecidos.
function nombresPersonas() {
  const m = new Map(); const add = (n, k) => { n = String(n || '').trim(); if (!n || n === 'COMPARTIDO') return; if (!m.has(n)) m.set(n, {n, filas: 0, ctrls: new Set(), perfiles: 0}); const x = m.get(n); if (k === 'f') x.filas++; else if (k === 'p') x.perfiles++; else x.ctrls.add(k); };
  for (const mv of S.movs.values()) add(mv.tipo, 'f');
  for (const c of S.ctrls) { (c.personas || []).forEach(n => add(n, c.corto || c.nombre)); Object.values(c.personasMes || {}).forEach(l => (l || []).forEach(n => add(n, c.corto || c.nombre))); }
  (S.perfiles || []).forEach(p => add(p.persona, 'p'));
  const lista = [...m.values()]; const clave = n => NORM(n).replace(/[^A-Z]/g, '');
  const dist = (a, b) => { const d = Array.from({length: a.length + 1}, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; };
  lista.forEach(x => { x.parecido = lista.filter(y => y !== x && dist(clave(x.n), clave(y.n)) <= 2).map(y => y.n); });
  return lista.sort((a, b) => a.n.localeCompare(b.n, 'es'));
}

// unificarNombre: Reemplaza un nombre por otro en movimientos, participantes y perfiles.
async function unificarNombre(de, a) {
  a = a.trim().toUpperCase(); if (!a || a === de) return toast('Escribe el nombre correcto, distinto al actual.');
  try {
    const d = await q(sb.from('movimientos').update({tipo: a}).eq('tipo', de).select());
    (d || []).forEach(m => S.movs.set(m.id, normMov(m)));
    for (const c of S.ctrls) {
      const fix = l => { const n = (l || []).map(x => x === de ? a : x); return [...new Set(n)]; };
      const antes = JSON.stringify([c.personas, c.personasMes]);
      c.personas = fix(c.personas); const pm = {}; Object.entries(c.personasMes || {}).forEach(([k, v]) => pm[k] = fix(v)); c.personasMes = pm;
      if (JSON.stringify([c.personas, c.personasMes]) !== antes) await guardarControl(c);
    }
    for (const pf of (S.perfiles || []).filter(p => p.persona === de)) { const r2 = await q(sb.from('perfiles').update({persona: a}).eq('id', pf.id).select()); if (r2 && r2[0]) Object.assign(pf, r2[0]); if (S.me && S.me.id === pf.id) S.me.persona = a; }
    toast(`"${de}" ahora es "${a}" (${(d || []).length} filas)`);
  } catch (e) {}
  derive(); render();
}

// detectarServidor: Revisa si el servidor auxiliar está disponible.
async function detectarServidor() {
  const probar = async base => { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 1500);
    try { const r = await fetch(base + '/api/ping', {signal: ac.signal, cache: 'no-store'}); if (!r.ok) return false; const j = await r.json(); return !!j.ok; } catch (_) { return false; } finally { clearTimeout(t); } };
  if (/^https?:$/.test(location.protocol) && await probar('')) HELPER = '';
  else if (location.protocol === 'https:' && await probar('http://localhost:8765')) HELPER = 'http://localhost:8765';
  if (S.view === 'ajustes') render();
}

// xmlAPayload: Convierte el XML del portal en el paquete de datos de la plataforma.
function xmlAPayload(txt) {
  const i = txt.search(/<\?xml|<dataset/i); if (i < 0) return null;
  const d = new DOMParser().parseFromString(txt.slice(i), 'text/xml');
  if (d.getElementsByTagName('parsererror').length) return null;
  const g = (r, n) => { const x = r.getElementsByTagName(n)[0]; return x ? x.textContent : ''; };
  // Además de los 10 campos de siempre se guardan los demás datos que traiga el portal (por ejemplo la cuenta destino de un traslado).
  const BASE = /^(id|mbDate|inOutCode|payType|inOutType|mbCategory|subCategory|mbContent|mbDetailContent|mbCash)$/;
  const extra = r => { const x = {}; let k = 0; [...r.children].forEach(c => { const v = (c.textContent || '').trim(); if (!BASE.test(c.tagName) && v) { x[c.tagName] = v; k++; } }); return k ? x : 0; };
  const rows = [...d.getElementsByTagName('row')].map(r => { const a = [g(r, 'id'), g(r, 'mbDate'), +g(r, 'inOutCode'), g(r, 'payType'), g(r, 'inOutType'), g(r, 'mbCategory'), g(r, 'subCategory'), g(r, 'mbContent'), g(r, 'mbDetailContent'), +g(r, 'mbCash')]; const x = extra(r); if (x) a.push(x); return a; }).filter(r => r[0] && r[1]);
  if (!rows.length) return null;
  const f = rows.map(r => r[1]).sort();
  return {v: 1, src: 'registro-contable', at: new Date().toISOString(), desde: f[0], hasta: f[f.length - 1], rows};
}
// syncDirecto: Sincroniza leyendo el portal directamente (con el servidor auxiliar).

// procesarPayload: Recibe los datos pegados y calcula nuevos, modificados y eliminados (vista previa).
async function procesarPayload(txt) {
  const msg = $('#syncMsg');
  let p = null; try { p = JSON.parse(txt); } catch (_) { p = xmlAPayload(txt); }
  if (!p || p.src !== 'registro-contable' || !Array.isArray(p.rows)) { msg.innerHTML = '<span class="neg">Eso no parece venir del portal. Vuelve a copiar los datos desde Registro Contable.</span>'; return; }
  msg.textContent = `Procesando ${p.rows.length} movimientos…`;
  const desde = (p.desde || '').slice(0, 7), hasta = (p.hasta || '').slice(0, 7);
  const prevRaw = new Map(); for (const [, doc] of S.tx) for (const r of (doc.rows || [])) prevRaw.set(r[0], r);
  const inMap = new Map(); for (const r of p.rows) if (r[0] && r[1]) inMap.set(r[0], r);
  const mods = [], dels = [], autoWeb = [], autoDel = [], reaparece = []; let nuevos = 0;

    const o = prevRaw.get(id);
    if (!o) { nuevos++; continue; }
    const dc = decisionDe(id); if (dc.borrado) reaparece.push(id);
    if (JSON.stringify(o) === JSON.stringify(r)) continue;
    const dif = difTx(rowToTx(o), rowToTx(r)); if (!dif.length) continue;

  if (prevRaw.size) for (const [id, o] of prevRaw) { const m = o[1].slice(0, 7); if (m >= desde && m <= hasta && !inMap.has(id)) { if (decisionDe(id).borrado) autoDel.push(id); else dels.push({id, o}); } }
  const ctx = {p, desde, hasta, prevRaw, inMap, mods, dels, autoWeb, autoDel, reaparece, nuevos, dec: {}};
  mods.forEach(x => ctx.dec[x.id] = 'app');
  dels.forEach(x => ctx.dec[x.id] = partes(x.id).length ? 'mantener' : 'borrar');

}

// registrarHistorial: Guarda en el historial la versión inicial y los cambios de cada registro.
async function registrarHistorial(prevTx, at, desde, hasta, msg, extra) {
  if (!S.hist) return;
  const cambiar = []; const ahora = new Date().toISOString(); const vacio = S.hist.size === 0;
  for (const t of D.txs) {
    const h = S.hist.get(t.id); const o = prevTx.get(t.id);
    if (!h) { cambiar.push({tx_id: t.id, primera: o && vacio ? null : at, visto: ahora, cambios: []}); continue; }
    if (o) { const d = difTx(o, t); if (d.length) cambiar.push(Object.assign({}, h, {cambios: [...(h.cambios || []), {at, d}]})); }
  }
  for (const [id, o] of prevTx) if (!D.byId.has(id) && o.mes >= desde && o.mes <= hasta) { const h = S.hist.get(id); const ult = h && (h.cambios || []).slice(-1)[0]; if (h && !(ult && ult.borrado)) cambiar.push(Object.assign({}, h, {cambios: [...(h.cambios || []), {at, borrado: true}]})); }
  for (const [id, ents] of Object.entries(extra || {})) { const k = cambiar.findIndex(x => x.tx_id === id); const base = k >= 0 ? cambiar[k] : S.hist.get(id); if (!base) continue; const nh = Object.assign({}, base, {cambios: [...(base.cambios || []), ...ents]}); if (k >= 0) cambiar[k] = nh; else cambiar.push(nh); }
  for (let i = 0; i < cambiar.length; i += 500) { const lote = cambiar.slice(i, i + 500); if (msg && cambiar.length > 500) msg.textContent = `Guardando historial… ${Math.min(i + 500, cambiar.length)} de ${cambiar.length}`; await q(sb.from('tx_hist').upsert(lote)); lote.forEach(x => S.hist.set(x.tx_id, x)); }
}

}

// asignar: Asigna registros de la app a un control (crea movimientos válidos).
async function asignar(ids, ctrlId, tipo, mesFijo, grupo) {
  const c = ctrlById(ctrlId); if (!c) return toast('Elige un control o proyecto.'); if (cerrado(c)) return toast('Ese proyecto está cerrado.');
  S.enCurso = S.enCurso || new Set();
  ids = ids.filter(id => !S.enCurso.has(id));
  const rows = ids.map(id => D.byId.get(id)).filter(t => t && restante(t) > 0.005).map(t => ({
    control: c.id, mes: c.porMes ? (mesFijo || t.mes) : 'general', lado: t.code === 0 ? 'ingreso' : 'egreso', fecha: t.fecha, tipo,
    cat: t.code === 0 ? '' : t.sub, sub: t.code === 0 ? '' : t.nota, descripcion: t.det, detalle: '', valor: restante(t), tx_id: t.id, estado: 'valido', origen: 'app', validado_por: S.me.id, validado_el: new Date().toISOString(), ...snapApp(t), ...(grupo && c.porMes ? {grupo} : {})}));
  if (!rows.length) return;

  try { await insertarMovs(rows, `${rows.length === 1 ? 'Asignado' : rows.length + ' asignados'} a ${c.corto || c.nombre}`); } catch (e) {} finally { ids.forEach(id => S.enCurso.delete(id)); }
}

// hojaFamiliar: Hoja de Excel de un control mensual (con fórmulas y reparto).
function hojaFamiliar(wb, c, h0) {

  const ws = wb.addWorksheet(mesHoja(h0.mes));

  ws.getCell('B1').value = 'DETALLE EGRESO'; ws.getCell('I1').value = 'DETALLE INGRESO';
  ws.getCell('B1').font = ws.getCell('I1').font = {bold: true, size: 14, name: 'Calibri'};
  ws.getCell('B2').value = MES[+h0.mes.slice(5) - 1]; ws.getCell('C2').value = +h0.mes.slice(0, 4);
  ['FECHA', 'TIPO', 'CATEGORIAS', 'SUBCATEGORIAS', 'DESCRIPCION', 'VALOR', 'ID APP', 'FECHA', 'DESCRIPCION', 'VALOR'].forEach((t, i) => { const cell = ws.getCell(3, i + 2); cell.value = t; estiloHdr(cell); });
  const n = Math.max(h.egresos.length, h.ingresos.length, 1) + 5; const f0 = 4, f1 = f0 + n - 1;
  h.egresos.forEach((r, i) => { const R = f0 + i; ws.getCell(R, 2).value = fechaX(r.fecha); ws.getCell(R, 3).value = r.tipo; ws.getCell(R, 4).value = r.cat; ws.getCell(R, 5).value = r.sub; ws.getCell(R, 6).value = r.descripcion; ws.getCell(R, 7).value = +r.valor; ws.getCell(R, 8).value = r.tx_id || null; });
  h.ingresos.forEach((r, i) => { const R = f0 + i; ws.getCell(R, 9).value = fechaX(r.fecha); ws.getCell(R, 10).value = r.tipo; ws.getCell(R, 11).value = +r.valor; });
  for (let R = f0; R <= f1; R++) { ws.getCell(R, 2).numFmt = ws.getCell(R, 9).numFmt = 'dd/mm/yyyy'; ws.getCell(R, 7).numFmt = ws.getCell(R, 11).numFmt = MONEYF; ws.getCell(R, 8).font = {color: {argb: 'FF808080'}, size: 9}; }
  const R_ = resumen(c, h0); const T = f1 + 1;
  const G = `$G$${f0}:$G$${f1}`, C = `$C$${f0}:$C$${f1}`, K = `$K$${f0}:$K$${f1}`, J = `$J$${f0}:$J$${f1}`;
  ws.getCell(T, 6).value = 'TOTAL'; ws.getCell(T, 7).value = {formula: `SUM(G${f0}:G${f1})`, result: R_.egreso};
  ws.getCell(T, 10).value = 'TOTAL'; ws.getCell(T, 11).value = {formula: `SUM(K${f0}:K${f1})`, result: R_.ingreso};
  [ws.getCell(T, 6), ws.getCell(T, 7), ws.getCell(T, 10), ws.getCell(T, 11)].forEach(x => { x.font = {bold: true}; x.border = {top: {style: 'thin'}}; });
  ws.getCell(T, 7).numFmt = ws.getCell(T, 11).numFmt = MONEYF;
  const A = T + 2; ws.getCell(A, 2).value = 'RESUMEN'; ws.getCell(A, 6).value = 'RESUMEN DISTIBUCION'; ws.getCell(A, 9).value = 'DISTIBUCION';
  [2, 6, 9].forEach(col => ws.getCell(A, col).font = {bold: true});
  [[2, 'DESCRIPCION'], [3, 'VALOR'], [6, 'DESCRIPCION'], [7, 'VALOR'], [9, 'DESCRIPCION'], [10, 'TOTAL A PAGAR'], [11, 'SALDO']].forEach(([col, t]) => { const x = ws.getCell(A + 1, col); x.value = t; estiloHdr(x); });
  const B = A + 2; const np = R_.per.length;
  ws.getCell(B, 2).value = 'INGRESO'; ws.getCell(B, 3).value = {formula: `K${T}`, result: R_.ingreso};
  ws.getCell(B + 1, 2).value = 'EGRESO'; ws.getCell(B + 1, 3).value = {formula: `-G${T}`, result: -R_.egreso};
  ws.getCell(B + 2, 2).value = 'SALDO'; ws.getCell(B + 2, 3).value = {formula: `SUM(C${B}:C${B + 1})`, result: R_.ingreso - R_.egreso};
  ws.getCell(B, 6).value = 'COMPARTIDO'; ws.getCell(B, 7).value = {formula: `-SUMIFS(${G},${C},F${B})+SUMIFS(${K},${J},F${B})`, result: R_.comp};
  R_.per.forEach((x, i) => {

  if (t.id === 'portalIn') { const v = normPortal(t.value); if (t.value.trim() && !v) return toast('Esa dirección no es válida. Cópiala tal cual aparece en la app.'); t.value = v; lsSet('portal', v); pintarEnlaces(); guardarAjuste('portal', v).catch(() => {}); return; }
  if (t.id === 'fileIn' && t.files[0]) { const f = t.files[0]; if (/\.xlsx$/i.test(f.name)) { const msg = $('#syncMsg'); try { await importarMonedas(f, msg); } catch (e) { msg.innerHTML = `<span class="neg">No se pudo leer el Excel: ${esc(errMsg(e))}</span>`; } t.value = ''; return; } procesarPayload(await f.text()); }
});

  if (e.target.dataset.ftab === 'q') { const k = e.target.dataset.k; S.ftab = S.ftab || {}; S.ftab[k] = Object.assign({q: '', sub: '', cuenta: ''}, S.ftab[k], {q: e.target.value}); clearTimeout(qT); qT = setTimeout(() => { S._focusF = k; render(); }, 250); return; }

});

/* Atajos de teclado: Enter para guardar en formularios y abrir filas, Escape para cerrar ventanas. */

  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.cr-row[data-act], g[data-act][role=button]')) { e.preventDefault(); e.target.click(); return; }
