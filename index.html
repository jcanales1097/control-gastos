<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E6A50">
<title>Control de Gastos Familiares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: libro contable de trabajo — barra fija arriba, vistas por pestaña, tablas densas con cifras en mono */
:root{
  --bg:#F4F6F3; --panel:#FFFFFF; --sunk:#EBEFEA; --line:#D7DDD6; --fg:#18211D; --muted:#5D6B64;
  --accent:#1E6A50; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --warn:#9A6A12; --warn-soft:#F8ECD3; --bad:#A93E2B; --bad-soft:#F7E0DA; --good:#2C7A4B;
  --ca:#1E6A50; --cb:#7A4E9C; --cc:#B0601E;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#18201C; --sunk:#1F2924; --line:#2E3A34; --fg:#E3EAE5; --muted:#93A39A;
  --accent:#4DB88D; --accent-ink:#0D1511; --accent-soft:#1C3A2E;
  --warn:#E0B055; --warn-soft:#3A2F17; --bad:#E7826D; --bad-soft:#3D221C; --good:#6BCB8F;
  --ca:#4DB88D; --cb:#B897D6; --cc:#E3995B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#18201C; --sunk:#1F2924; --line:#2E3A34; --fg:#E3EAE5; --muted:#93A39A;
  --accent:#4DB88D; --accent-ink:#0D1511; --accent-soft:#1C3A2E;
  --warn:#E0B055; --warn-soft:#3A2F17; --bad:#E7826D; --bad-soft:#3D221C; --good:#6BCB8F;
  --ca:#4DB88D; --cb:#B897D6; --cc:#E3995B; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
nav.tabs a .dot{width:8px;height:8px;border-radius:50%}
.count{font-family:var(--f-num);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;line-height:17px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--fg)}
a.btn.pri{color:var(--accent-ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.sync-meta{font-size:12px;color:var(--muted)}
main{padding-block:20px 60px}
h1{font-size:22px;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;letter-spacing:.01em}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.panel>.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel>.bd{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.app{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.c-a{background:var(--ca)} .c-b{background:var(--cb)} .c-c{background:var(--cc)} .c-d{background:var(--warn)} .c-e{background:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td.desc{min-width:220px}
td .cat{font-size:11px;color:var(--muted)}
select.in,input.in{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font-size:12.5px;max-width:190px}
input.in.num{width:110px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px}
.kpi .v{font-family:var(--f-num);font-size:19px;font-weight:500;margin-top:2px}
.neg{color:var(--bad)} .pos{color:var(--good)}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:12.5px;font-weight:600}
.months button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mes-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mes-pick select.in{width:auto;min-width:0;font-weight:600}
.dist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.dist td,.dist th{padding:7px 10px}
.dist tr.tot td{font-weight:700;border-top:2px solid var(--fg)}
.note{font-size:12px;color:var(--muted)}
.bulk{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bulk select{background:var(--bg);color:var(--fg);border:0}
.bulk .btn{background:var(--bg);color:var(--fg);border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;max-width:640px;width:100%;border:1px solid var(--line)}
.modal .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .bd{padding:18px;display:flex;flex-direction:column;gap:14px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
textarea.paste{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px;font-family:var(--f-num);font-size:12px}
.bm{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
code.blk{display:block;white-space:pre-wrap;word-break:break-all;font-family:var(--f-num);font-size:11px;background:var(--sunk);padding:10px;border-radius:8px;max-height:110px;overflow:auto}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form-grid input,.form-grid select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 8px;font-size:13px;color:var(--fg);font-weight:400}
.chk{flex-direction:row!important;align-items:center;gap:8px!important}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;min-width:200px;flex:1;max-width:320px}
.filters select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;max-width:100%}
.panel>.filters{padding:10px 14px;border-bottom:1px solid var(--line)}
.addrow td{background:var(--sunk)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
@media (max-width:600px){.brand span{display:none}.sync-meta{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

a{color:var(--accent)}
.auth{max-width:440px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.brand-auth{display:flex;flex-direction:column;gap:2px;text-align:center}
.brand-auth b{font-size:22px;letter-spacing:-.015em}
.brand-auth span{color:var(--muted);font-size:13px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.fld input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 11px;font-size:15px;color:var(--fg);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
a.card-link{color:inherit;text-decoration:none;display:block}
a.card-link:hover{border-color:var(--accent)}
a.kpi{color:inherit;text-decoration:none}
a.kpi:hover{background:var(--sunk)}
.count.warn-bg{background:var(--warn);color:var(--panel)}
.count.muted-bg{background:var(--muted);color:var(--panel)}
.warn-t{color:var(--warn)}
tr.st-pendiente td{background:var(--warn-soft)}
tr.st-rechazado td{opacity:.6}
.panel.nuevo{border-color:var(--warn)}
.linkish{background:none;border:0;padding:0;margin:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.linkish:hover{color:var(--accent);text-decoration:underline}
.count.bad-bg{background:var(--bad);color:var(--panel)}
a.chip{text-decoration:none}
.modal .dist th{position:static;font-weight:600;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);white-space:normal}
#userBox{display:flex;align-items:center;gap:6px}
.top .wrap{row-gap:8px}
</style>
</head>
<body>
<header class="top" id="topbar" hidden>
  <div class="wrap">
    <div class="brand"><b>Control de Gastos</b></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="row" style="gap:8px">
      <span class="sync-meta" id="syncMeta"></span>
      <button class="btn pri" id="btnSync" hidden>Sincronizar</button>
      <span id="userBox"></span>
    </div>
  </div>
</header>
<main class="wrap" id="app"><div class="loading">Cargando…</div></main>
<div id="modalRoot"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const NF = new Intl.NumberFormat('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const L = v => (v < 0 ? '-L ' : 'L ') + NF.format(Math.abs(v || 0));
const MES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
const mesLargo = m => { if (!m || m === 'general') return 'Todo el proyecto'; const [y, mm] = m.split('-'); return MES[+mm - 1].charAt(0) + MES[+mm - 1].slice(1).toLowerCase() + ' ' + y; };
const mesHoja = m => { const [y, mm] = m.split('-'); return `${y.slice(2)} ${mm} | ${MES[+mm - 1]}`; };
const fFecha = d => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '—';
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const cents = v => Math.round(Math.abs(+v || 0) * 100);
const dias = (a, b) => Math.abs((Date.parse(a) - Date.parse(b)) / 864e5);
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
let toastT;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600);
}
const app = () => $('#app');

/* ================= conexión ================= */
const CFG = Object.assign({supabaseUrl: '', supabaseAnonKey: ''}, window.CG_CONFIG || {});
if (!CFG.supabaseUrl) { CFG.supabaseUrl = lsGet('cg-sb-url') || ''; CFG.supabaseAnonKey = lsGet('cg-sb-key') || ''; }
let sb = null;

/* ================= estado ================= */
const S = {
  me: null, ctrls: [], movs: new Map(), tx: new Map(), ign: new Map(), aj: {}, perfiles: [], accesos: [],
  view: 'inicio', sel: new Set(), mesSel: {}, filtros: {q: '', ctrl: '', mes: '', todos: false, estado: '', nat: '', cuenta: ''}, limite: 300,
  authView: 'login', recuperando: false, ligarAbierto: null, rechazoAbierto: null,
};
let D = {txs: [], byId: new Map(), asig: new Map()};
const esAdmin = () => !!(S.me && S.me.rol === 'admin' && S.me.activo);
const ctrls = () => S.ctrls;
const ctrlById = id => S.ctrls.find(c => c.id === id);
const colorClass = c => 'c-' + (c && c.color || 'e');
const esProy = c => !!c && !c.porMes;
const cerrado = c => esProy(c) && c.estado === 'cerrado';
const familiares = () => S.ctrls.filter(c => !esProy(c));
const proyectos = () => S.ctrls.filter(esProy);
const abiertos = () => S.ctrls.filter(c => !cerrado(c));
const hrefC = c => '#' + (esProy(c) ? 'p-' : 'c-') + c.id;
const nombreDe = id => { if (S.me && id === S.me.id) return 'Tú'; const p = S.perfiles.find(x => x.id === id); return p ? (p.nombre || p.email) : 'Otro usuario'; };

const fromC = r => ({id: r.id, nombre: r.nombre, corto: r.corto || r.nombre, porMes: r.tipo === 'mensual', personas: r.personas || [], categorias: r.categorias || [], incluye: r.incluye || '', excluye: r.excluye || '', tipoDefecto: r.tipo_defecto || 'COMPARTIDO', sugerirPorNombre: !!r.sugerir_por_nombre, color: r.color || 'a', estado: r.estado || 'abierto', abiertoEl: r.abierto_el, cerradoEl: r.cerrado_el, orden: r.orden || 0, personasMes: r.personas_mes || {}});
const toC = c => ({id: c.id, nombre: c.nombre, corto: c.corto || c.nombre, tipo: c.porMes ? 'mensual' : 'proyecto', personas: c.personas, categorias: c.categorias, incluye: c.incluye, excluye: c.excluye, tipo_defecto: c.tipoDefecto, sugerir_por_nombre: c.sugerirPorNombre, color: c.color, estado: c.estado, abierto_el: c.abiertoEl || null, cerrado_el: c.cerradoEl || null, orden: c.orden || 0, personas_mes: c.personasMes || {}});
const normMov = m => Object.assign({}, m, {valor: +m.valor || 0, fecha: m.fecha ? String(m.fecha).slice(0, 10) : null, app_monto: m.app_monto == null ? null : +m.app_monto, app_fecha: m.app_fecha ? String(m.app_fecha).slice(0, 10) : null});

function derive() {
  const txs = [];
  for (const [, doc] of S.tx) for (const r of (doc.rows || [])) {
    const [id, fecha, code, cuenta, tipoMov, cat, sub, nota, det, monto] = r;
    txs.push({id, fecha, code, cuenta, tipoMov, cat: (cat || '').trim(), sub: (sub || '').trim(), nota: (nota || '').trim(), det: (det || '').trim(), monto: Math.abs(+monto || 0), mes: fecha.slice(0, 7)});
  }
  txs.sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0);
  const asig = new Map(); for (const m of S.movs.values()) if (m.tx_id && m.estado !== 'rechazado') { if (!asig.has(m.tx_id)) asig.set(m.tx_id, []); asig.get(m.tx_id).push(m); }
  D = {txs, byId: new Map(txs.map(t => [t.id, t])), asig};
}
const partes = id => D.asig.get(id) || [];
const asignado = id => partes(id).reduce((s, m) => s + (+m.valor || 0), 0);
const restante = t => Math.round((t.monto - asignado(t.id)) * 100) / 100;
const snapApp = t => ({app_monto: t.monto, app_fecha: t.fecha, app_detalle: t.det, app_cuenta: t.cuenta, app_categoria: t.cat});
const personasDe = (c, mes) => { if (!c) return []; const pm = c.personasMes || {}; return c.porMes && mes && Array.isArray(pm[mes]) ? pm[mes] : (c.personas || []); };
function cambioDe(m) {
  if (!esAdmin() || !m.tx_id || m.estado === 'rechazado') return null;
  const t = D.byId.get(m.tx_id);
  if (!t) { const mes = (m.app_fecha || m.fecha || '').slice(0, 7); return S.tx.has(mes) ? {tipo: 'eliminado'} : null; }
  if (m.app_monto == null) return null;
  const d = [];
  if (cents(t.monto) !== cents(m.app_monto)) d.push(['Monto', L(m.app_monto), L(t.monto)]);
  if (m.app_fecha && t.fecha !== m.app_fecha) d.push(['Fecha', fFecha(m.app_fecha), fFecha(t.fecha)]);
  if (m.app_detalle != null && t.det !== m.app_detalle) d.push(['Detalle', m.app_detalle, t.det]);
  if (m.app_cuenta && t.cuenta !== m.app_cuenta) d.push(['Cuenta', m.app_cuenta, t.cuenta]);
  if (m.app_categoria && t.cat !== m.app_categoria) d.push(['Categoría', m.app_categoria, t.cat]);
  return d.length ? {tipo: 'modificado', d, t} : null;
}
const cambios = () => esAdmin() ? [...S.movs.values()].map(m => ({m, c: cambioDe(m)})).filter(x => x.c).sort((a, b) => (a.m.fecha || '') < (b.m.fecha || '') ? -1 : 1) : [];
function applies(c, t) {
  const cat = (t.cat || '').trim();
  if (cerrado(c)) return false;
  const cats = (c.categorias || []).filter(Boolean);
  if (esProy(c) && !c.incluye) return false;
  if (!cats.length && !esProy(c)) return false;
  if (cats.length && !cats.some(p => cat.startsWith(p))) return false;
  const hay = (t.det + ' ' + t.nota + ' ' + t.sub).toUpperCase();
  if (c.incluye && !hay.includes(c.incluye.toUpperCase())) return false;
  if (c.excluye && t.det.toUpperCase().includes(c.excluye.toUpperCase())) return false;
  return true;
}
const sugerido = t => proyectos().find(c => applies(c, t)) || familiares().find(c => applies(c, t));
function tipoSugerido(c, t) {
  if (!c) return '';
  if (c.sugerirPorNombre) { const d = t.det.toUpperCase(); const p = personasDe(c, t.mes).find(p => d.includes(p.toUpperCase()) || d.includes(p.split(' ')[0].toUpperCase())); if (p) return p; }
  if (t.code === 0) return personasDe(c, t.mes)[0] || '';
  return c.tipoDefecto || 'COMPARTIDO';
}
function estadoTx(t) {
  if (D.asig.has(t.id)) return restante(t) > 0.005 ? 'pendiente' : 'asignado';
  if (S.ign.has(t.id)) return 'noaplica';
  if (t.code === 3) return 'traslado';
  if (t.fecha > hoy()) return 'futuro';
  if (t.fecha < (S.aj.inicio || '0000')) return 'anterior';
  return sugerido(t) ? 'pendiente' : 'otro';
}
const bandeja = () => esAdmin() ? D.txs.filter(t => estadoTx(t) === 'pendiente') : [];
const porValidar = () => [...S.movs.values()].filter(m => m.estado === 'pendiente');
function hoja(controlId, mes) {
  const rows = [...S.movs.values()].filter(m => m.control === controlId && m.mes === mes);
  const ord = (a, b) => (a.fecha || '') < (b.fecha || '') ? -1 : (a.fecha || '') > (b.fecha || '') ? 1 : (a.creado_el < b.creado_el ? -1 : 1);
  return {control: controlId, mes, egresos: rows.filter(r => r.lado === 'egreso').sort(ord), ingresos: rows.filter(r => r.lado === 'ingreso').sort(ord)};
}
const mesesDe = id => [...new Set([...S.movs.values()].filter(m => m.control === id).map(m => m.mes))].sort().reverse();

function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/row-level security/i.test(m)) return 'No tienes permiso para hacer ese cambio.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión con la base de datos. Revisa tu internet.';
  if (/JWT expired/i.test(m)) return 'Tu sesión expiró. Vuelve a entrar.';
  return m;
}
async function q(promesa, okMsg) {
  const {data, error} = await promesa;
  if (error) { toast(errMsg(error)); throw error; }
  if (okMsg) toast(okMsg);
  return data;
}
async function todo(tabla, orden) {
  const out = [];
  for (let a = 0; ; a += 1000) {
    let qq = sb.from(tabla).select('*'); if (orden) qq = qq.order(orden);
    const {data, error} = await qq.range(a, a + 999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break;
  }
  return out;
}
async function cargarTodo() {
  const {data: u} = await sb.auth.getUser();
  const uid = u && u.user && u.user.id;
  const {data: me, error} = await sb.from('perfiles').select('*').eq('id', uid).maybeSingle();
  if (error) throw error;
  S.me = me || {id: uid, email: u.user.email, activo: false, rol: 'usuario'};
  if (!S.me.activo) return;
  const [ctr, movs] = await Promise.all([todo('controles', 'orden'), todo('movimientos', 'creado_el')]);
  S.ctrls = ctr.map(fromC); S.movs = new Map(movs.map(m => [m.id, normMov(m)]));
  if (esAdmin()) {
    const [tx, ign, aj, pf, ac] = await Promise.all([todo('tx_mes', 'mes'), todo('ignorados'), todo('ajustes'), todo('perfiles', 'creado_el'), todo('accesos')]);
    S.tx = new Map(tx.map(t => [t.mes, t])); S.ign = new Map(ign.map(i => [i.tx_id, i]));
    S.aj = Object.fromEntries(aj.map(a => [a.clave, a.valor])); S.perfiles = pf; S.accesos = ac;
    if (!S.aj.inicio) S.aj.inicio = hoy().slice(0, 8) + '01';
  } else {
    S.tx = new Map(); S.ign = new Map(); S.aj = {}; S.perfiles = [S.me];
    S.accesos = await q(sb.from('accesos').select('*').eq('usuario', uid));
  }
}

const guardarControl = async c => { const r = await q(sb.from('controles').upsert(toC(c)).select()); return r; };

async function init() {

  if (!window.supabase || !window.supabase.createClient) return fatal('No se pudo cargar la conexión con la base de datos. Revisa tu internet y recarga la página.');
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; renderAuth(); return; }
    if (ev === 'SIGNED_OUT' || !session) { S.me = null; renderAuth(); return; }
    if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && !S.recuperando && (!S.me || S.me.id !== session.user.id)) arrancar();
  });
}

async function enviarAuth(form) {
  const v = form.dataset.v; const msg = $('#authMsg'); const btn = form.querySelector('[type=submit]');
  const email = $('#aEmail') && $('#aEmail').value.trim(); const pass = $('#aPass') && $('#aPass').value;
  if ((v === 'login' || v === 'registro' || v === 'olvido') && !/^\S+@\S+\.\S+$/.test(email || '')) { msg.innerHTML = '<span class="neg">Escribe un correo válido.</span>'; return; }
  if ((v === 'registro' || v === 'nueva') && (pass || '').length < 8) { msg.innerHTML = '<span class="neg">La contraseña debe tener al menos 8 caracteres.</span>'; return; }
  btn.disabled = true; msg.textContent = 'Un momento…';
  const volver = location.origin + location.pathname;
  try {
    if (v === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) msg.innerHTML = `<span class="neg">${/confirm/i.test(error.message) ? 'Primero confirma tu correo con el enlace que te enviamos.' : 'Correo o contraseña incorrectos.'}</span>`;
    } else if (v === 'registro') {
      const {data, error} = await sb.auth.signUp({email, password: pass, options: {data: {nombre: $('#aNombre').value.trim()}, emailRedirectTo: volver}});
      if (error) msg.innerHTML = `<span class="neg">${esc(errMsg(error))}</span>`;
      else if (!data.session) msg.innerHTML = '<span class="pos">Listo. Te enviamos un correo para confirmar tu cuenta; ábrelo y luego entra aquí.</span>';
    } else if (v === 'olvido') {
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: volver});
      msg.innerHTML = error ? `<span class="neg">${esc(errMsg(error))}</span>` : '<span class="pos">Si el correo tiene cuenta, te llegará un enlace para crear una contraseña nueva.</span>';
    } else if (v === 'nueva') {
      const {error} = await sb.auth.updateUser({password: pass});
      if (error) msg.innerHTML = `<span class="neg">${esc(errMsg(error))}</span>`;
      else { S.recuperando = false; toast('Contraseña actualizada'); history.replaceState(null, '', location.pathname); arrancar(); }
    }
  } finally { btn.disabled = false; }
}

function resumen(c, h) {
  const val = r => r.estado === 'valido';
  const eg = h.egresos.filter(val), ing = h.ingresos.filter(val);
  const sum = (a, f) => a.filter(f).reduce((s, r) => s + (+r.valor || 0), 0);
  const ps = [...personasDe(c, h.mes)];
  eg.concat(ing).forEach(r => { if (r.tipo && r.tipo !== 'COMPARTIDO' && !ps.includes(r.tipo)) ps.push(r.tipo); });
  const comp = -sum(eg, r => r.tipo === 'COMPARTIDO') + sum(ing, r => r.tipo === 'COMPARTIDO');
  const n = Math.max(1, personasDe(c, h.mes).length || ps.length);
  const per = ps.map(p => { const g = -sum(eg, r => r.tipo === p); const pagar = comp / n + g; const aporte = sum(ing, r => r.tipo === p); return {p, g, pagar, aporte, saldo: pagar + aporte}; });
  const todas = h.egresos.concat(h.ingresos);
  return {comp, per, n, ingreso: sum(ing, () => true), egreso: sum(eg, () => true), filas: todas.length, ligados: todas.filter(r => r.tx_id).length,
    pendientes: todas.filter(r => r.estado === 'pendiente').length, pendienteValor: h.egresos.filter(r => r.estado === 'pendiente').reduce((s, r) => s + r.valor, 0)};
}

  [...S.movs.values()].filter(m => m.control === c.id && m.tipo && m.tipo !== 'COMPARTIDO').forEach(m => s.add(m.tipo));
  (S.partTmp || []).forEach(p => s.add(p));
  return [...s];
}

  const ps = partes(txId).map(m => ({id: m.id, control: m.control, tipo: m.tipo, mes: m.mes, valor: m.valor, orig: m}));
  if (!ps.length) { const c = sugerido(t) || familiares()[0]; ps.push({control: c.id, tipo: tipoSugerido(c, t), mes: c.porMes ? t.mes : 'general', valor: t.monto}); }
  S.rep = {t, partes: ps, borrar: []}; pintarReparto();
}
function pintarReparto() {
  const {t, partes: ps} = S.rep; const lado = t.code === 0 ? 'ingreso' : 'egreso';

      <div class="tbl-wrap"><table><thead><tr><th>Control o proyecto</th><th>Tipo</th><th>Mes</th><th class="num">Monto</th><th></th></tr></thead><tbody>
      ${ps.map((p, i) => { const c = ctrlById(p.control); return `<tr data-i="${i}"><td>${ctrlSelect(p.control, 'class="in" data-rp="control" aria-label="Control o proyecto"')}</td>
        <td><select class="in" data-rp="tipo" aria-label="Tipo">${tipoOptions(c, p.tipo, lado, p.mes)}</select></td>

      </tbody></table></div>
      <div class="row"><button class="btn sm" data-act="rpAgregar">Agregar parte</button>${resto > 0.005 ? `<span class="note">Lo que no repartas (${L(resto)}) sigue en la bandeja.</span>` : ''}${resto < -0.005 ? `<span class="small neg">Repartiste ${L(-resto)} de más.</span>` : ''}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="rpGuardar" ${resto < -0.005 ? 'disabled' : ''}>Guardar reparto</button></div>

async function guardarReparto() {
  const {t, partes: ps, borrar} = S.rep; const lado = t.code === 0 ? 'ingreso' : 'egreso';
  if (ps.some(p => !(+p.valor > 0))) return toast('Cada parte necesita un monto mayor que cero.');
  if (ps.some(p => !p.id && cerrado(ctrlById(p.control)))) return toast('No puedes agregar partes a un proyecto cerrado.');
  try {
    for (const id of borrar) { await q(sb.from('movimientos').delete().eq('id', id)); S.movs.delete(id); }
    const nuevos = [];
    for (const p of ps) {
      const c = ctrlById(p.control); const mes = c.porMes ? (p.mes === 'general' ? t.mes : p.mes) : 'general';
      if (p.id) {
        const o = p.orig; const ch = {};
        if (o.control !== p.control) ch.control = p.control; if (o.tipo !== p.tipo) ch.tipo = p.tipo; if (o.mes !== mes) ch.mes = mes; if (cents(o.valor) !== cents(p.valor)) ch.valor = +p.valor;
        if (Object.keys(ch).length) { const d = await q(sb.from('movimientos').update(ch).eq('id', p.id).select()); if (d && d[0]) S.movs.set(p.id, normMov(d[0])); }
      } else nuevos.push({control: c.id, mes, lado, fecha: t.fecha, tipo: p.tipo, cat: lado === 'ingreso' ? '' : t.sub, sub: lado === 'ingreso' ? '' : t.nota, descripcion: t.det, detalle: '', valor: +p.valor, tx_id: t.id, estado: 'valido', origen: 'app', validado_por: S.me.id, validado_el: new Date().toISOString(), ...snapApp(t)});
    }
    if (nuevos.length) { const d = await q(sb.from('movimientos').insert(nuevos).select()); (d || []).forEach(m => S.movs.set(m.id, normMov(m))); }
  } catch (e) { derive(); render(); return; }
  S.rep = null; $('#modalRoot').innerHTML = ''; derive(); render(); toast('Reparto guardado');
}

/* ================= reporte PDF ================= */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const AUTOTABLE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
function cargarScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar el generador de PDF. Revisa tu internet.')); document.head.appendChild(s); }); }
async function exportarPDF(c, mes) {
  toast('Preparando PDF…');
  try {
    if (!window.jspdf) await cargarScript(JSPDF_URL);
    if (!window.jspdf.jsPDF.API.autoTable) await cargarScript(AUTOTABLE_URL);
    const {jsPDF} = window.jspdf; const doc = new jsPDF({unit: 'pt', format: 'letter'});
    const h = hoja(c.id, mes); const R = resumen(c, h); const val = r => r.estado === 'valido';
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40; let y = 50;
    const verde = [30, 106, 80], gris = [93, 107, 100], tinta = [24, 33, 29];
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(...tinta); doc.text(c.nombre, M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...gris); y += 17;
    doc.text(c.porMes ? mesLargo(mes) : (cerrado(c) ? `Proyecto cerrado el ${fFecha(c.cerradoEl)}` : 'Proyecto abierto'), M, y);
    doc.text(`Generado el ${new Date().toLocaleString('es-HN', {dateStyle: 'long', timeStyle: 'short'})}`, W - M, y, {align: 'right'});
    y += 24;
    const titulo = t => { if (y > H - 110) { doc.addPage(); y = 50; } doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...tinta); doc.text(t, M, y); y += 7; };
    const tabla = o => { doc.autoTable(Object.assign({startY: y, margin: {left: M, right: M}, styles: {font: 'helvetica', fontSize: 9, cellPadding: 4, textColor: tinta, lineColor: [215, 221, 214], lineWidth: 0.4}, headStyles: {fillColor: verde, textColor: 255, fontStyle: 'bold'}, footStyles: {fillColor: [235, 239, 234], textColor: tinta, fontStyle: 'bold'}, alternateRowStyles: {fillColor: [246, 248, 245]}}, o)); y = doc.lastAutoTable.finalY + 20; };
    const der = cols => Object.fromEntries(cols.map(i => [i, {halign: 'right'}]));
    titulo('Resumen');
    tabla({head: [['Ingresos', 'Egresos', 'Saldo', 'Por validar']], body: [[L(R.ingreso), L(-R.egreso), L(R.ingreso - R.egreso), String(R.pendientes)]], columnStyles: der([0, 1, 2, 3])});
    if (c.porMes) {
      titulo('Resumen de distribución');
      tabla({head: [['Descripción', 'Valor']], body: [['COMPARTIDO', L(R.comp)], ...R.per.map(x => [x.p, L(x.g)])], foot: [['SALDO', L(R.comp + R.per.reduce((s, x) => s + x.g, 0))]], columnStyles: der([1])});
      titulo(`Distribución por persona (compartido entre ${R.n})`);
      tabla({head: [['Persona', 'Total a pagar', 'Aportó', 'Saldo', 'Situación']], body: R.per.map(x => [x.p, L(x.pagar), L(x.aporte), L(x.saldo), x.saldo < -0.004 ? `Le falta ${L(-x.saldo)}` : x.saldo > 0.004 ? `A favor ${L(x.saldo)}` : 'Al día']), columnStyles: der([1, 2, 3])});
    } else if (R.per.length) { titulo('Egresos por TIPO'); tabla({head: [['TIPO', 'Egresos']], body: R.per.map(x => [x.p, L(-x.g)]), columnStyles: der([1])}); }
    const eg = h.egresos.filter(val), ing = h.ingresos.filter(val);
    titulo(`Detalle de egresos (${eg.length})`);
    tabla({head: [['Fecha', 'TIPO', 'Categoría', 'Descripción', 'Valor']], body: eg.length ? eg.map(r => [fFecha(r.fecha), r.tipo, [r.cat, r.sub].filter(Boolean).join(' / '), r.descripcion || r.detalle, L(r.valor)]) : [['', '', '', 'Sin egresos', '']], foot: [['', '', '', 'Total', L(R.egreso)]], columnStyles: {0: {cellWidth: 56}, 1: {cellWidth: 86}, 2: {cellWidth: 118}, 4: {halign: 'right', cellWidth: 72}}});
    titulo(`Detalle de ingresos (${ing.length})`);
    tabla({head: [['Fecha', 'Persona', 'Descripción', 'Valor']], body: ing.length ? ing.map(r => [fFecha(r.fecha), r.tipo, r.descripcion || r.detalle, L(r.valor)]) : [['', '', 'Sin ingresos', '']], foot: [['', '', 'Total', L(R.ingreso)]], columnStyles: {0: {cellWidth: 56}, 1: {cellWidth: 110}, 3: {halign: 'right', cellWidth: 72}}});
    if (R.pendientes) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text(`No incluye ${R.pendientes} registros por validar.`, M, Math.min(y, H - 40)); }

    const base = c.nombre.toUpperCase().normalize('NFD').replace(/[̀-ͯ()]/g, '').trim().replace(/\s+/g, '_');
    descargar(`${base}${c.porMes ? '_' + mes : ''}.pdf`, doc.output('blob'));

function xmlAPayload(txt) {

  const g = (r, n) => { const x = r.getElementsByTagName(n)[0]; return x ? x.textContent : ''; };
  const rows = [...d.getElementsByTagName('row')].map(r => [g(r, 'id'), g(r, 'mbDate'), +g(r, 'inOutCode'), g(r, 'payType'), g(r, 'inOutType'), g(r, 'mbCategory'), g(r, 'subCategory'), g(r, 'mbContent'), g(r, 'mbDetailContent'), +g(r, 'mbCash')]).filter(r => r[0] && r[1]);

  const f = rows.map(r => r[1]).sort();
  return {v: 1, src: 'registro-contable', at: new Date().toISOString(), desde: f[0], hasta: f[f.length - 1], rows};
}
async function syncDirecto() {

async function procesarPayload(txt) {

  const porMes = new Map();
  for (const r of p.rows) { if (!r[0] || !r[1]) continue; const m = r[1].slice(0, 7); if (!porMes.has(m)) porMes.set(m, []); porMes.get(m).push(r); }

  const mesesCamb = [];
  for (const [m, rows] of porMes) { rows.sort((a, b) => a[0] < b[0] ? -1 : 1); const prev = S.tx.get(m); if (!prev || JSON.stringify(prev.rows) !== JSON.stringify(rows)) mesesCamb.push({mes: m, rows, n: rows.length, sincronizado: p.at}); }

    for (let i = 0; i < mesesCamb.length; i += 4) { const lote = mesesCamb.slice(i, i + 4); await q(sb.from('tx_mes').upsert(lote)); lote.forEach(c => S.tx.set(c.mes, c)); msg.textContent = `Guardando meses… ${Math.min(i + 4, mesesCamb.length)} de ${mesesCamb.length}`; }
    await guardarAjuste('ultimaSync', {at: new Date().toISOString(), n: p.rows.length, desde: p.desde, hasta: p.hasta});
  } catch (e) { msg.innerHTML = `<span class="neg">Se interrumpió la sincronización: ${esc(errMsg(e))}</span>`; return; }
  derive(); render();
  const nuevos = D.txs.filter(t => !antes.has(t.id)).length;
  const ahora = new Set(D.byId.keys());
  let modificados = 0, eliminados = 0;
  for (const t of D.txs) { const o = prevTx.get(t.id); if (o && (cents(o.monto) !== cents(t.monto) || o.fecha !== t.fecha || o.det !== t.det || o.cuenta !== t.cuenta || o.cat !== t.cat)) modificados++; }
  for (const [id, o] of prevTx) if (!ahora.has(id) && o.mes >= desde && o.mes <= hasta) eliminados++;

}
