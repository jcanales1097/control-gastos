// xmlAPayload: Convierte el XML del portal en el paquete de datos de la plataforma.
function xmlAPayload(txt) {
  const i = txt.search(/<\?xml|<dataset/i); if (i < 0) return null;
  const d = new DOMParser().parseFromString(txt.slice(i), 'text/xml');
  if (d.getElementsByTagName('parsererror').length) return null;
  const g = (r, n) => { const x = r.getElementsByTagName(n)[0]; return x ? x.textContent : ''; };
  // Además de los 10 campos de siempre se guardan los demás datos que traiga el portal (por ejemplo la cuenta destino de un traslado).
  const BASE = /^(id|mbDate|inOutCode|payType|inOutType|mbCategory|subCategory|mbContent|mbDetailContent|mbCash)$/;
  const extra = r => { const x = {}; let k = 0; [...r.children].forEach(c => { const v = (c.textContent || '').trim(); if (!BASE.test(c.tagName) && v) { x[c.tagName] = v; k++; } }); return k ? x : 0; };
  const rows = [...d.getElementsByTagName('row')].map(r => { const a = [g(r, 'id'), g(r, 'mbDate'), +g(r, 'inOutCode'), g(r, 'payType'), g(r, 'inOutType'), g(r, 'mbCategory'), g(r, 'subCategory'), g(r, 'mbContent'), g(r, 'mbDetailContent'), +g(r, 'mbCash')]; const x = extra(r); if (x) a.push(x); return a; }).filter(r => r[0] && r[1]);
  if (!rows.length) return null;
  const f = rows.map(r => r[1]).sort();
  return {v: 1, src: 'registro-contable', at: new Date().toISOString(), desde: f[0], hasta: f[f.length - 1], rows};
}
// syncDirecto: Sincroniza leyendo el portal directamente (con el servidor auxiliar).
async function syncDirecto() {
  const msg = $('#syncMsg'); const base = portalActual(); const btn = $('#btnSyncDirecto');
  if (!base) { msg.innerHTML = '<span class="neg">Pega primero la dirección que muestra la app.</span>'; $('#portalIn').focus({preventScroll: true}); return; }
  const y = new Date().getFullYear(); const desde = `${y - 1}-01-01`, hasta = `${y}-12-31`;
  if (btn) btn.disabled = true; msg.textContent = 'Leyendo el portal del iPhone…';
  try {
    const r = await fetch(`${HELPER}/api/portal?base=${encodeURIComponent(base)}&desde=${desde}&hasta=${hasta}`, {cache: 'no-store'});
    const txt = await r.text();
    if (!r.ok) { let m = 'No se pudo leer el portal.'; try { m = JSON.parse(txt).error || m; } catch (_) {} msg.innerHTML = `<span class="neg">${esc(m)}</span>`; return; }
    const p = xmlAPayload(txt); if (!p) { msg.innerHTML = '<span class="neg">El portal respondió, pero no traía movimientos.</span>'; return; }
    p.desde = desde; p.hasta = hasta; await procesarPayload(JSON.stringify(p));
  } catch (e) { msg.innerHTML = '<span class="neg">No pude comunicarme con el servidor local. ¿Sigue abierta la ventana de "Control de Gastos" en tu Mac?</span>'; }
  finally { if (btn) btn.disabled = false; }
}
// procesarPayload: Recibe los datos pegados y calcula nuevos, modificados y eliminados (vista previa).
async function procesarPayload(txt) {
  const msg = $('#syncMsg');
  let p = null; try { p = JSON.parse(txt); } catch (_) { p = xmlAPayload(txt); }
  if (!p || p.src !== 'registro-contable' || !Array.isArray(p.rows)) { msg.innerHTML = '<span class="neg">Eso no parece venir del portal. Vuelve a copiar los datos desde Registro Contable.</span>'; return; }
  msg.textContent = `Procesando ${p.rows.length} movimientos…`;
  const desde = (p.desde || '').slice(0, 7), hasta = (p.hasta || '').slice(0, 7);
  const prevRaw = new Map(); for (const [, doc] of S.tx) for (const r of (doc.rows || [])) prevRaw.set(r[0], r);
  const inMap = new Map(); for (const r of p.rows) if (r[0] && r[1]) inMap.set(r[0], r);
  const mods = [], dels = [], autoWeb = [], autoDel = [], reaparece = []; let nuevos = 0;
  for (const [id, r] of inMap) {
    const o = prevRaw.get(id);
    if (!o) { nuevos++; continue; }
    const dc = decisionDe(id); if (dc.borrado) reaparece.push(id);
    if (JSON.stringify(o) === JSON.stringify(r)) continue;
    const dif = difTx(rowToTx(o), rowToTx(r)); if (!dif.length) continue;
    if (dc.web && dc.web.app === JSON.stringify(r)) { autoWeb.push(id); continue; }
    mods.push({id, o, r, dif});
  }
  if (prevRaw.size) for (const [id, o] of prevRaw) { const m = o[1].slice(0, 7); if (m >= desde && m <= hasta && !inMap.has(id)) { if (decisionDe(id).borrado) autoDel.push(id); else dels.push({id, o}); } }
  const ctx = {p, desde, hasta, prevRaw, inMap, mods, dels, autoWeb, autoDel, reaparece, nuevos, dec: {}};
  mods.forEach(x => ctx.dec[x.id] = 'app');
  dels.forEach(x => ctx.dec[x.id] = partes(x.id).length ? 'mantener' : 'borrar');
  if (!mods.length && !dels.length) return aplicarSync(ctx);
  S.syncPend = ctx; pintarPrevia();
}

    </div>
    <div class="bd row" style="justify-content:flex-end;border-top:1px solid var(--line)"><button class="btn" data-act="prevCancelar">Cancelar</button><button class="btn pri" data-act="prevGuardar">Guardar sincronización</button></div></div>`;
}
// aplicarSync: Aplica la sincronización: guarda los meses, decisiones e historial.
async function aplicarSync(X) {
  const msg = $('#syncMsg'); const {p, desde, hasta, prevRaw, inMap} = X; const at = p.at || new Date().toISOString();
  const cambiosAntes = cambios().length; const prevTx = new Map(D.byId);
  const fin = new Map(inMap);
  for (const x of X.mods) if (X.dec[x.id] === 'web') fin.set(x.id, x.o);
  for (const id of X.autoWeb) fin.set(id, prevRaw.get(id));
  for (const x of X.dels) if (X.dec[x.id] === 'mantener') fin.set(x.id, x.o);
  for (const id of X.autoDel) fin.set(id, prevRaw.get(id));
  const porMes = new Map(); const ponerEn = (m, r) => { if (!porMes.has(m)) porMes.set(m, []); porMes.get(m).push(r); };
  for (const r of fin.values()) ponerEn(r[1].slice(0, 7), r);
  for (const m of S.tx.keys()) if (m >= desde && m <= hasta && !porMes.has(m)) porMes.set(m, []);
  for (const [m, doc] of S.tx) if (m < desde || m > hasta) for (const r of (doc.rows || [])) if (!fin.has(r[0])) ponerEn(m, r);
  const mesesCamb = [];
  for (const [m, rows] of porMes) { rows.sort((a, b) => a[0] < b[0] ? -1 : 1); const prev = S.tx.get(m); if (!prev || JSON.stringify(prev.rows) !== JSON.stringify(rows)) mesesCamb.push({mes: m, rows, n: rows.length, sincronizado: p.at}); }
  for (const m of S.tx.keys()) if (!porMes.has(m)) { const prev = S.tx.get(m); if ((prev.rows || []).length) mesesCamb.push({mes: m, rows: [], n: 0, sincronizado: p.at}); }
  try {
    for (let i = 0; i < mesesCamb.length; i += 4) { const lote = mesesCamb.slice(i, i + 4); await q(sb.from('tx_mes').upsert(lote)); lote.forEach(c => S.tx.set(c.mes, c)); msg.textContent = `Guardando meses… ${Math.min(i + 4, mesesCamb.length)} de ${mesesCamb.length}`; }
    await guardarAjuste('ultimaSync', {at: new Date().toISOString(), n: p.rows.length, desde: p.desde, hasta: p.hasta});
  } catch (e) { msg.innerHTML = `<span class="neg">Se interrumpió la sincronización: ${esc(errMsg(e))}</span>`; return; }
  S.syncPend = null; derive(); render();
  const extra = {};
  for (const x of X.mods) if (X.dec[x.id] === 'web') extra[x.id] = [{at, d: x.dif, decision: 'web', app: JSON.stringify(x.r)}];
  for (const x of X.dels) if (X.dec[x.id] === 'mantener') extra[x.id] = [{at, borrado: true, decision: 'mantener'}];
  for (const id of X.reaparece) extra[id] = [...(extra[id] || []), {at, reaparece: true}];
  await registrarHistorial(prevTx, at, desde, hasta, msg, extra).catch(() => {});
  let filasAct = 0;
  for (const x of X.mods) if (X.dec[x.id] === 'app') { const pp = partes(x.id); const t = D.byId.get(x.id); if (pp.length !== 1 || !t) continue; const m = pp[0]; if (m.app_monto == null) continue;
    const ch = snapApp(t); if (cents(m.valor) === cents(m.app_monto)) ch.valor = t.monto;
    if (m.app_fecha && m.fecha === m.app_fecha) { ch.fecha = t.fecha; const c = ctrlById(m.control); if (c && c.porMes && m.mes === m.app_fecha.slice(0, 7)) ch.mes = t.fecha.slice(0, 7); }
    if (m.descripcion === m.app_detalle) ch.descripcion = t.det;
    try { const d = await q(sb.from('movimientos').update(ch).eq('id', m.id).select()); if (d && d[0]) { S.movs.set(m.id, normMov(d[0])); filasAct++; } } catch (e) {} }
  derive(); render();
  const nWeb = X.mods.filter(x => X.dec[x.id] === 'web').length, nApp = X.mods.length - nWeb, nMan = X.dels.filter(x => X.dec[x.id] === 'mantener').length, nBor = X.dels.length - nMan;

/* ===================== Editar registros de Registro Contable =====================

const appEds = () => (S.aj && S.aj.appEdits) || {};

  const o = Object.assign({}, prev, cambios); const n = {app, por: S.me.id, el: new Date().toISOString()}; let hay = false;
  ['fecha', 'cuenta', 'cat', 'sub', 'nota', 'det'].forEach(k => { if (k in o && (o[k] || '') !== (app[k] || '')) { n[k] = o[k] || ''; hay = true; } });
  if (o.monto != null && cents(o.monto) !== cents(app.monto)) { n.monto = +o.monto; hay = true; }
  ['plastico', 'elim', 'elim_por', 'elim_el'].forEach(k => { if (o[k] != null) { n[k] = o[k]; hay = true; } });   // marcas que no son de los campos editables

/* ===================== Una tarjeta = una cuenta =====================
   Desde que todo se registra en la web, cada tarjeta es UNA cuenta bimoneda: su saldo en lempiras y en dólares. Por dentro conserva
   una cuenta de lempiras y otra de dólares (sus dos libros); las demás cuentas que tenía (las de las extensiones o cuentas viejas
   de la app) se juntan en ese libro y cada registro guarda qué plástico lo hizo (campo "plastico": titular o extensión).
   Lo que se mueve: registros web (cuenta / cuenta destino en Supabase) y de la app (edición web). Las cuentas juntadas quedan
   inhabilitadas y su saldo inicial pasa al libro. Todo queda anotado en el ajuste "unifTj" para poder deshacerlo. */
const unifHecho = () => (S.aj && S.aj.unifTj && S.aj.unifTj.el) ? S.aj.unifTj : null;
// tjLibro: cuenta principal de la tarjeta en esa moneda (la que queda).
function tjLibro(tit, mon) { const k = mon === 'USD' ? 'cta_usd' : 'cta_l'; if (tit[k]) return tjCta(tit[k]);
  const extsCtas = new Set(tjExts(tit).flatMap(e => [e.cta_l, e.cta_usd, ...(e.cuentas || [])]).filter(Boolean).map(tjCta));
  const l = (tit.cuentas || []).map(tjCta).filter(c => !extsCtas.has(c) && tjMonDe(c) === mon && !(ctaNombres().includes(c) && ctaInfo(c).elim));
  return l.find(c => !(ctaNombres().includes(c) && ctaInfo(c).oculta)) || l[0] || ''; }
// unifPlan: por tarjeta, qué cuentas se juntan en qué libro y con qué plástico, y cuántos registros se mueven.
function unifPlan() {
  const appTodos = [...D.txs.filter(t => !t.web), ...(S._postCorte || []), ...(S._appElim || [])];
  return (S.tj || []).filter(t => !t.titular).map(tit => {
    const exts = tjExts(tit); const libro = {L: tjLibro(tit, 'L'), USD: tjLibro(tit, 'USD')}; const movs = [];
    [...tjSet(tit)].forEach(acct => { const mon = tjMonDe(acct); let dest = libro[mon]; if (!dest) { libro[mon] = dest = acct; }   // sin libro en esa moneda: esta cuenta pasa a serlo
      const pl = exts.find(e => [e.cta_l, e.cta_usd, ...(e.cuentas || [])].filter(Boolean).map(tjCta).includes(acct)) || null;
      if (acct === dest && !pl) return;
      const web = (S.reg || []).filter(r => r.estado !== 'eliminado' || true).filter(r => tjCta(r.cuenta || '') === acct || tjCta(r.cuenta_destino || '') === acct);
      const app = appTodos.filter(t => tjCta(t.cuenta) === acct);
      movs.push({acct, dest, mon, pl: pl ? pl.id : null, web: web.map(r => r.id), app: app.map(t => t.id), base: acct !== dest && ctaNombres().includes(acct) ? +ctaInfo(acct).cfg.saldo_inicial || 0 : 0}); });
    return {tit, libro, movs}; }).filter(x => x.movs.length || (x.tit.cuentas || []).length > 2); }
function vUnifPanel() {
  if (!esAdmin()) return ''; const h = unifHecho();
  if (h && !S.unifVer) return `<div class="note unif-n">Cada tarjeta es una sola cuenta (unificadas el ${fFecha(h.el.slice(0, 10))}${h.parcial ? ', <b class="neg">quedó a medias</b>' : ''}). <button class="btn sm ghost" data-act="unifVer">Ver</button></div>`;
  if (h) return S.unifVer ? `<div class="panel unif-p"><div class="bd stack"><div><b>Tarjetas unificadas</b> el ${new Date(h.el).toLocaleString('es-HN', {dateStyle: 'medium', timeStyle: 'short'})}: cada tarjeta es una sola cuenta (L y $) y cada registro guarda su plástico.</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">${S.unifDeshQ ? `<span class="note">¿Deshacer? Los registros vuelven a sus cuentas de antes.</span><button class="btn sm ghost" data-act="unifDeshNo">No</button><button class="btn sm danger" data-act="unifDesh">Sí, deshacer</button>` : `<button class="btn sm ghost danger" data-act="unifDeshQ">Deshacer la unificación</button>`}<button class="btn sm ghost" data-act="unifVer">Cerrar</button></div></div></div>` : '';
  const plan = unifPlan(); const tot = plan.reduce((a, x) => { x.movs.forEach(m => { a.web += m.web.length; a.app += m.app.length; a.ctas += m.acct !== m.dest ? 1 : 0; }); return a; }, {web: 0, app: 0, ctas: 0});
  if (!tot.ctas && !tot.web && !tot.app) return '';
  if (!S.fPl) return `<div class="panel unif-p"><div class="bd"><b>Una tarjeta = una cuenta.</b> Para unificar las cuentas de las tarjetas corre primero en Supabase el SQL <code>tarjeta_cuenta.sql</code> (agrega el plástico a cada registro) y recarga.</div></div>`;
  return `<div class="panel unif-p"><div class="hd"><h2 style="margin-right:auto">Una tarjeta = una cuenta</h2></div><div class="bd stack">
    <div>Cada tarjeta queda como una sola cuenta con saldo en lempiras y en dólares. Las cuentas de sus extensiones y las cuentas viejas se juntan en ella; cada registro guarda qué plástico lo hizo.</div>
    <div class="unif-l">${plan.map(x => `<div><b>${esc(tjNomC(x.tit))}</b><span class="note">queda: ${[x.libro.L, x.libro.USD].filter(Boolean).map(esc).join(' · ')}</span>${x.movs.filter(m => m.acct !== m.dest || m.pl).map(m => `<span class="unif-m">${esc(m.acct)} → ${esc(m.dest)}${m.pl ? ' · ' + esc(tjNomPl(tjById(m.pl))) : ''} <span class="note">${m.web.length} web · ${m.app.length} app</span></span>`).join('')}</div>`).join('')}</div>
    <div class="note">${tot.ctas} ${tot.ctas === 1 ? 'cuenta se junta' : 'cuentas se juntan'} · ${tot.web} registros web y ${tot.app} de la app cambian de cuenta. Los saldos de cada tarjeta no cambian. Se puede deshacer.</div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="corteRespaldo">Descargar respaldo</button>${S.unifQ ? `<span class="note">¿Unificar ahora?</span><button class="btn sm ghost" data-act="unifNo">No</button><button class="btn sm pri" data-act="unifSi">Sí, unificar</button>` : `<button class="btn sm pri" data-act="unifQ">Unificar las cuentas de las tarjetas</button>`}</div></div></div>`; }
async function unifAplicar() {

function filtrosActivos(f) { return [...f.querySelectorAll('select:not([data-nocuenta])')].filter(x => x.value).length + [...f.querySelectorAll('input[type=date]:not(#bDesde)')].filter(x => x.value).length + [...f.querySelectorAll('input[type=checkbox]')].filter(x => x.checked).length; }
function filtrosTelefono(root) {
  root.querySelectorAll('.filters').forEach(f => {
    const n = f.querySelectorAll('select, input:not([type=search])').length;
    if (!esTelefono() || n < 3) { f.classList.remove('f-plegable', 'f-cerrado'); f.querySelectorAll(':scope > .f-tog').forEach(x => x.remove()); return; }
    f.classList.add('f-plegable'); f.classList.toggle('f-cerrado', !_filtrosAbiertos);
    let b = f.querySelector(':scope > .f-tog'); if (!b) { b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm f-tog'; b.dataset.act = 'filtrosTel'; f.appendChild(b); }
    const a = filtrosActivos(f); b.classList.toggle('on', a > 0); const tx = (_filtrosAbiertos ? 'Ocultar filtros' : 'Filtros') + (a ? ' · ' + a : ''); if (b.textContent !== tx) b.textContent = tx;   // solo si cambia (evita redibujos en cadena)
  });
}
// Encabezado contraíble en el teléfono. El encabezado es fijo y solo se desliza hacia arriba (transform), así el alto de la página
// no cambia y no hay parpadeo. Se ignoran los rebotes de iOS al inicio y al final, y hace falta un recorrido mínimo para cambiar.
(function () {
  const h = () => document.getElementById('topbar');
  const medir = () => { const t = h(); if (!t) return; const tabs = document.getElementById('tabs'); const r = document.documentElement.style;
    r.setProperty('--hdr', t.offsetHeight + 'px'); r.setProperty('--hrow1', (tabs ? tabs.offsetTop : 44) + 'px'); };
  const poner = v => { const t = h(); if (t && t.classList.contains('top-min') !== v) t.classList.toggle('top-min', v); };
  try { new ResizeObserver(medir).observe(document.getElementById('topbar')); } catch (e) {} addEventListener('resize', medir);
  let yAnt = window.scrollY, acc = 0;
  addEventListener('scroll', () => {
    if (!esTelefono() || _fondoY !== null) { poner(false); return; }
    const y = window.scrollY, max = document.documentElement.scrollHeight - innerHeight; if (y < 0 || y > max) return;
    const d = y - yAnt; yAnt = y; if (y < 50) { acc = 0; return poner(false); }
    if (d && Math.sign(d) !== Math.sign(acc)) acc = 0; acc += d;
    if (acc > 30) poner(true); else if (acc < -30) poner(false);
  }, {passive: true});
})();
function tablasTelefono(root) {
  filtrosTelefono(root);
  if (!esTelefono()) { root.querySelectorAll('table.tcards').forEach(t => t.classList.remove('tcards')); return; }
  root.querySelectorAll('table').forEach(t => {

    if (t.classList.contains('tcards')) return;
    if (t.classList.contains('tj2') || t.classList.contains('cr-pl') || t.scrollWidth > w.clientWidth + 4) { etiquetarTabla(t); t.classList.add('tcards'); }
  });
}
(function () {
  let pend = false; const correr = () => { pend = false; tablasTelefono(document.getElementById('app')); tablasTelefono(document.getElementById('modalRoot')); };
  const obs = new MutationObserver(() => { if (!pend) { pend = true; queueMicrotask(correr); } });
  ['app', 'modalRoot'].forEach(id => { const e = document.getElementById(id); if (e) obs.observe(e, {childList: true, subtree: true}); });
  matchMedia('(max-width:760px)').addEventListener('change', correr);
})();
